<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Скамейки Твери</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script
      src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=ВАШ_КЛЮЧ"
      type="text/javascript"
    ></script>
    <style>
      :root {
        --primary: #2d6da8;
        --bg: #0a0e17;
        --card: #0f1b2d;
        --text: #fff;
        --gray: #5a6b7d;
        --border: #1e3a5f;
        --green: #27ae60;
        --red: #e74c3c;
        --yellow: #ffd700;
      }
      body.light {
        --bg: #f5f5f5;
        --card: #fff;
        --text: #1a1a1a;
        --gray: #8a8a8a;
        --border: #e0e0e0;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
      }
      #authScreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        padding: 20px;
      }
      #authScreen.hidden {
        display: none;
      }
      .auth-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }
      .auth-logo {
        text-align: center;
        font-size: 2.5em;
        color: var(--primary);
        margin-bottom: 10px;
      }
      .auth-title {
        text-align: center;
        font-size: 1.5em;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .auth-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .auth-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        color: var(--gray);
      }
      .auth-tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9em;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1em;
        outline: none;
        background: var(--bg);
        color: var(--text);
      }
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
      }
      .btn i {
        margin-right: 5px;
      }
      #mainApp {
        display: none;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        position: relative;
      }
      #mainApp.active {
        display: flex;
      }
      #map {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .search-container {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        z-index: 2000;
      }
      .search-bar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 1em;
        color: var(--text);
        background: transparent;
      }
      #searchResultsList {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        z-index: 2500;
        max-height: 350px;
        overflow-y: auto;
        display: none;
        margin-top: 5px;
      }
      #searchResultsList.active {
        display: block;
      }
      .search-result-item {
        padding: 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search-result-item i {
        color: var(--primary);
        width: 20px;
      }
      .search-result-item .name {
        flex: 1;
        font-weight: 600;
        font-size: 0.95em;
      }
      .search-result-item .dist {
        color: var(--green);
        font-weight: 700;
        font-size: 0.85em;
      }
      .map-buttons {
        position: absolute;
        right: 15px;
        top: 80px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .map-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--card);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 1.1em;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .map-btn.primary {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .bench-card {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        z-index: 1500;
        max-height: 75vh;
        overflow-y: auto;
        transform: translateY(100%);
        transition: 0.3s;
      }
      .bench-card.active {
        transform: translateY(0);
      }
      .bench-card-handle {
        width: 40px;
        height: 4px;
        background: var(--gray);
        border-radius: 2px;
        margin: 10px auto;
      }
      .bench-card-content {
        padding: 0 20px 20px;
      }
      .bench-card-title {
        font-size: 1.3em;
        font-weight: 700;
      }
      .bench-card-title i {
        color: var(--primary);
        margin-right: 8px;
      }
      .bench-card-distance {
        color: var(--green);
        font-weight: 700;
        margin: 5px 0;
      }
      .bench-card-desc {
        color: var(--gray);
        margin-bottom: 10px;
      }
      .bench-card-photos {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 10px 0;
      }
      .bench-card-photos img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .bench-card-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .bench-card-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .bench-card-btn i {
        margin-right: 5px;
      }
      .btn-route {
        background: var(--primary);
        color: #fff;
      }
      .btn-reviews {
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-fav {
        background: var(--bg);
        border: 1px solid var(--border);
        width: 50px;
        flex: none;
        color: var(--gray);
        font-size: 1.3em;
        cursor: pointer;
      }
      .btn-fav.active {
        color: var(--red);
      }
      .btn-report {
        background: var(--bg);
        border: 1px solid var(--border);
        width: 50px;
        flex: none;
        color: var(--gray);
        cursor: pointer;
      }
      .btn-like {
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .btn-like.active {
        color: var(--primary);
        border-color: var(--primary);
      }
      .close-btn {
        background: rgba(45, 109, 168, 0.3);
        border: 1px solid rgba(45, 109, 168, 0.5);
        color: var(--primary);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1em;
        flex-shrink: 0;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.active {
        display: flex !important;
      }
      .modal-content {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 25px;
        width: 100%;
        max-width: 500px;
        max-height: 85vh;
        overflow-y: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 100000;
        font-weight: 600;
      }
      .overlay-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.8);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .overlay-box {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 25px;
        text-align: center;
        max-width: 350px;
        width: 100%;
      }
      .review-item {
        padding: 15px;
        background: var(--bg);
        border-radius: 12px;
        margin-bottom: 10px;
      }
      .profile-stat {
        flex: 1;
        text-align: center;
        padding: 15px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .profile-stat .v {
        font-size: 1.5em;
        font-weight: 700;
        color: var(--primary);
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        margin: 5px;
        font-size: 0.85em;
      }
      .section-title {
        font-size: 1.1em;
        font-weight: 700;
        margin: 20px 0 10px;
      }
    </style>
  </head>
  <body>
    <div id="authScreen">
      <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-chair"></i></div>
        <div class="auth-title">Скамейки Твери</div>
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="showLogin()">Вход</div>
          <div class="auth-tab" onclick="showRegister()">Регистрация</div>
        </div>
        <div id="loginBox">
          <div class="form-group">
            <label>Логин</label><input type="text" id="loginLogin" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="loginPassword" />
          </div>
          <button class="btn" onclick="doLogin()">Войти</button>
        </div>
        <div id="registerBox" style="display: none">
          <div class="form-group">
            <label>Логин (англ.)</label><input type="text" id="regLogin" />
          </div>
          <div class="form-group">
            <label>Никнейм</label><input type="text" id="regNickname" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="regPassword" />
          </div>
          <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
        </div>
      </div>
    </div>
    <div id="mainApp">
      <div id="map"></div>
      <div class="search-container">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            type="text"
            placeholder="Поиск по адресу..."
            id="searchInput"
            oninput="searchBenches()"
          />
        </div>
        <div id="searchResultsList"></div>
      </div>
      <div class="map-buttons">
        <button class="map-btn" onclick="findMe()">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
        <button class="map-btn" onclick="showNearby()">
          <i class="fa-solid fa-chair"></i>
        </button>
        <button class="map-btn primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="map-btn" onclick="loadBenches()">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="map-btn" onclick="openProfile()">
          <i class="fa-solid fa-user"></i>
        </button>
        <button class="map-btn" onclick="openTopUsers()">
          <i class="fa-solid fa-trophy"></i>
        </button>
      </div>
      <div class="bench-card" id="benchCard">
        <div class="bench-card-handle"></div>
        <div class="bench-card-content" id="benchCardContent"></div>
      </div>
    </div>
    <div id="reviewsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Отзывы</h2>
          <button class="close-btn" onclick="closeModal('reviewsModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="reviewsContent"></div>
      </div>
    </div>
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Профиль</h2>
          <button class="close-btn" onclick="closeModal('profileModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="profileContent"></div>
      </div>
    </div>
    <div id="addModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Новая скамейка</h2>
          <button class="close-btn" onclick="closeModal('addModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="addModalContent"></div>
      </div>
    </div>
    <div id="nearbyModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Поблизости</h2>
          <button class="close-btn" onclick="closeModal('nearbyModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="nearbyContent"></div>
      </div>
    </div>
    <div id="topModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Топ</h2>
          <button class="close-btn" onclick="closeModal('topModal')">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div id="topContent"></div>
      </div>
    </div>
    <script>
      var currentUser = null,
        userPosition = null,
        myMap = null,
        userPlacemark = null,
        allBenches = [],
        selectedBench = null,
        searchResults = [],
        searchTimeout = null,
        reviewRating = 0,
        profileInterval = null;
      var badWords = [
        "блять",
        "сука",
        "хуй",
        "пизда",
        "ебать",
        "нахуй",
        "хер",
        "мудак",
        "пидор",
        "шлюха",
        "жопа",
        "говно",
        "дерьмо",
        "тварь",
        "мразь",
        "сволочь",
        "чмо",
        "лох",
        "дебил",
        "идиот",
        "дурак",
        "тупой",
        "урод",
      ];
      function containsBadWords(t) {
        if (!t) return false;
        var l = t.toLowerCase();
        for (var i = 0; i < badWords.length; i++) {
          if (l.indexOf(badWords[i]) > -1) return true;
        }
        return false;
      }
      function isValidLatin(s) {
        return /^[a-zA-Z0-9_]+$/.test(s);
      }
      function escapeHtml(text) {
        if (!text) return "";
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("active");
      }
      function createBenchIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="8" y="40" width="48" height="5" rx="2.5" fill="#2d6da8"/><rect x="12" y="18" width="40" height="5" rx="2.5" fill="#3d8bd0"/><rect x="10" y="18" width="5" height="27" rx="2.5" fill="#1e4d7a"/><rect x="49" y="18" width="5" height="27" rx="2.5" fill="#1e4d7a"/><rect x="8" y="45" width="5" height="14" rx="2.5" fill="#1e4d7a"/><rect x="51" y="45" width="5" height="14" rx="2.5" fill="#1e4d7a"/></svg>',
            ),
          iconImageSize: [40, 40],
          iconImageOffset: [-20, -40],
        };
      }
      function createUserIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 2 C18 14 8 26 8 40 C8 53 18 62 32 62 C46 62 56 53 56 40 C56 26 46 14 32 2 Z" fill="#3498db" stroke="white" stroke-width="2"/><circle cx="32" cy="38" r="13" fill="white"/><circle cx="32" cy="38" r="7" fill="#3498db"/></svg>',
            ),
          iconImageSize: [45, 45],
          iconImageOffset: [-22, -45],
        };
      }
      ymaps.ready(function () {
        myMap = new ymaps.Map("map", {
          center: [56.8587, 35.9176],
          zoom: 13,
          controls: [],
        });
        loadBenches();
      });
      function showLogin() {
        document.querySelectorAll(".auth-tab")[0].classList.add("active");
        document.querySelectorAll(".auth-tab")[1].classList.remove("active");
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("registerBox").style.display = "none";
      }
      function showRegister() {
        document.querySelectorAll(".auth-tab")[1].classList.add("active");
        document.querySelectorAll(".auth-tab")[0].classList.remove("active");
        document.getElementById("registerBox").style.display = "block";
        document.getElementById("loginBox").style.display = "none";
      }
      function showToast(m) {
        var o = document.querySelector(".toast");
        if (o) o.remove();
        var t = document.createElement("div");
        t.className = "toast";
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(function () {
          t.remove();
        }, 3000);
      }
      function showOverlay(icon, color, title, msg) {
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box"><div style="font-size:3em;color:' +
          color +
          ';margin-bottom:15px"><i class="fa-solid ' +
          icon +
          '"></i></div><h3>' +
          escapeHtml(title) +
          '</h3><p style="color:var(--gray);margin:10px 0 20px">' +
          escapeHtml(msg) +
          '</p><button class="btn" onclick="this.closest(\'.overlay-modal\').remove()">OK</button></div>';
        o.addEventListener("click", function(e) {
          if (e.target === o) o.remove();
        });
        document.body.appendChild(o);
      }
      function createOverlayModal(contentHtml) {
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box" style="position:relative">' +
          '<button class="close-btn" style="position:absolute;top:10px;right:10px" onclick="this.closest(\'.overlay-modal\').remove()"><i class="fa-solid fa-xmark"></i></button>' +
          contentHtml +
          "</div>";
        o.addEventListener("click", function(e) {
          if (e.target === o) o.remove();
        });
        document.body.appendChild(o);
        return o;
      }
      function closeOverlay(el) {
        el.closest(".overlay-modal").remove();
      }
      function doRegister() {
        var l = document.getElementById("regLogin").value.trim(),
          n = document.getElementById("regNickname").value.trim(),
          p = document.getElementById("regPassword").value;
        if (!l || !n || !p) {
          showToast("Заполните все поля");
          return;
        }
        if (!isValidLatin(l)) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Логин только англ!");
          return;
        }
        if (containsBadWords(n)) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Мат!");
          return;
        }
        fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: l, password: p, nickname: n }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              showOverlay("fa-check", "#27ae60", "Успех!", "Регистрация!");
              showLogin();
            } else {
              showOverlay("fa-xmark", "#e74c3c", "Ошибка", d.error);
            }
          });
      }
      function doLogin() {
        var l = document.getElementById("loginLogin").value.trim(),
          p = document.getElementById("loginPassword").value;
        if (!l || !p) {
          showToast("Введите данные");
          return;
        }
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: l, password: p }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              currentUser = d.user;
              localStorage.setItem("tver_user", JSON.stringify(currentUser));
              document.getElementById("authScreen").classList.add("hidden");
              document.getElementById("mainApp").classList.add("active");
              loadBenches();
              setTimeout(findMe, 1000);
            } else {
              showOverlay("fa-xmark", "#e74c3c", "Ошибка", d.error);

      function searchBenches() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          var q = document.getElementById("searchInput").value.trim();
          if (!q || q.length < 3) {
            document
              .getElementById("searchResultsList")
              .classList.remove("active");
            return;
          }
          ymaps.geocode("Тверь, " + q, { results: 10 }).then(function (res) {
            searchResults = [];
            var firstResult = res.geoObjects.get(0);
            if (firstResult) {
              var c = firstResult.geometry.getCoordinates();
              allBenches.forEach(function (b) {
                var dd = calcDist(c[0], c[1], b.latitude, b.longitude);
                if (dd <= 5) {
                  searchResults.push({
                    name: b.description || "Скамейка",
                    dist:
                      dd < 1
                        ? Math.round(dd * 1000) + " м"
                        : dd.toFixed(1) + " км",
                    bench: b,
                    _dist: dd,
                  });
                }
              });
              searchResults.sort(function (a, b) { return a._dist - b._dist; });
            }
            showSearchResults();
          }).catch(function (e) {
            document.getElementById("searchResultsList").classList.remove("active");
          });
        }, 500);
      }
      function showSearchResults() {
        var l = document.getElementById("searchResultsList");
        l.innerHTML = "";
        if (!searchResults.length) {
          l.classList.remove("active");
          return;
        }
        searchResults.slice(0, 8).forEach(function (r) {
          var d = document.createElement("div");
          d.className = "search-result-item";
          d.innerHTML =
            '<i class="fa-solid fa-chair"></i><span class="name">' +
            escapeHtml(r.name) +

            showBenchCard(r.bench);
          };
          l.appendChild(d);
        });
        l.classList.add("active");
      }
      function calcDist(a, b, c, d) {
        var R = 6371,
          dLat = ((c - a) * Math.PI) / 180,
          dLon = ((d - b) * Math.PI) / 180;
        var x =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((a * Math.PI) / 180) *
            Math.cos((c * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }

                          : b.status === "pending"
                            ? "⏳"
                            : "❌";
                      return (
                        '<div class="search-result-item"><span>' +
                        st +
                        '</span><span class="name">' +
                        escapeHtml(b.description || "Скамейка") +
                        "</span></div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/favorites")
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("myFavBox").innerHTML =
              d && d.favorites && d.favorites.length
                ? d.favorites
                    .map(function (b) {
                      return (
                        '<div class="search-result-item" onclick="focusFavBench(' +
                        b.id +
                        ')"><span class="name">' +
                        escapeHtml(b.description || "Скамейка") +
                        "</span></div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/received-reviews")
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("myReviewsBox").innerHTML =
              d && d.reviews && d.reviews.length
                ? d.reviews
                    .map(function (r) {
                      var ph = "";
                      if (r.photos && r.photos.length) {
                        ph = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
                        r.photos.forEach(function (p) {
                          var u = p.photo_url;
                          if (u.indexOf("/") === 0) u = window.location.origin + u;
                          ph += '<img src="' + u + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">';
                        });
                        ph += "</div>";
                      }
                      return (
                        '<div class="review-item"><b>' +
                        escapeHtml(r.reviewer || "Аноним") +
                        "</b>: " +
                        escapeHtml(r.comment || "") +
                        ph +
                        "</div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/reports")
          .then((r) => r.json())
          .then(function (d) {
            var mr = document.getElementById("myReportsBox");
            if (d && d.reports && d.reports.length) {
              mr.innerHTML = d.reports
                .map(function (rp) {
                  var st =
                    rp.status === "pending"
                      ? "⏳ Ожидает"
                      : rp.admin_response
                        ? "✅ Отвечено"
                        : "✅ Обработана";
                   var resp = rp.admin_response
                     ? '<div style="color:var(--green);margin-top:5px"><i class="fa-solid fa-reply"></i> ' +
                       escapeHtml(rp.admin_response) +
                       "</div>"
                     : "";
                   var ph = "";
                   if (rp.photos && rp.photos.length) {
                     ph = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
                     rp.photos.forEach(function (p) {
                       var u = p.photo_url;
                       if (u.indexOf("/") === 0) u = window.location.origin + u;
                       ph += '<img src="' + u + '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">';
                     });
                     ph += "</div>";
                   }
                   var removeBtn =
                     rp.status !== "pending"
                       ? '<button class="btn-sm" style="margin-top:8px;background:#5a6b7d;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer" onclick="removeReport(' +
                         rp.id +
                         ', this)">Убрать из списка</button>'
                       : "";
                   return (
                     '<div class="review-item"><b>' +
                     escapeHtml(rp.bench_name) +
                     '</b><div style="color:var(--gray);font-size:.9em">' +
                     escapeHtml(rp.reason) +
                     " — " +
                     st +
                     "</div>" +
                     ph +
                     resp +
                     removeBtn +
                     "</div>"
                   );
                })
                .join("");
            } else {
              mr.innerHTML = '<p style="color:var(--gray)">Нет жалоб</p>';
            }
          });
      }
      function removeReport(id, btn) {
        if (!confirm("Убрать жалобу из списка?")) return;
        fetch("/api/user/reports/" + id, { method: "DELETE" })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              var item = btn.closest(".review-item");
              if (item) item.remove();
              showToast("Убрано из списка");
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function reportReview(reviewId, benchId) {
        if (!currentUser) {
          showToast("Войдите");
          return;
        }
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box"><h3>Жалоба на отзыв</h3><div class="form-group" style="text-align:left"><label>Причина</label><select id="reviewReportReason" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"><option value="spam">Спам</option><option value="insult">Оскорбление</option><option value="fake">Неточная информация</option></select></div><button class="btn" onclick="sendReviewReport(' +
          reviewId +
          ', ' +
          benchId +
          ')">Отправить</button></div>';
        document.body.appendChild(o);
      }
      function sendReviewReport(reviewId, benchId) {
        var reason = document.getElementById("reviewReportReason").value;
        fetch("/api/reviews/" + reviewId + "/report", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: currentUser.id, reason: reason }),
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.success) {
            document.querySelectorAll(".overlay-modal").forEach(function (e) { e.remove(); });
            showToast("Жалоба отправлена");
          } else {
            showToast(d.error || "Ошибка");
          }
        });
      }
      function logout() {
        currentUser = null;
        localStorage.removeItem("tver_user");
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.remove("active");
        closeModal("profileModal");
      }
      checkAuth();
    </script>
  </body>
</html>
