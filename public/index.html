<!doctype html>
<!--
  ============================================================================
  index.html — главная страница приложения «Скамейки Твери» (клиентская часть)
  ----------------------------------------------------------------------------
  Что внутри:
    • <head>      — подключение шрифтов, иконок Font Awesome и скрипта Яндекс.Карт
    • <style>     — весь дизайн (CSS) приложения
    • <body>      — разметка экранов: вход, карта, модальные окна
    • <script>    — вся логика: карта, поиск, авторизация, отзывы, избранное и т.д.
  Приложение работает как одностраничник: экраны переключаются через классы
  (например, добавление/удаление класса "active" или "hidden").
  ============================================================================
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Настройки масштаба для мобильных: запрещаем зум, чтобы интерфейс
         выглядел как нативное приложение -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Скамейки Твери</title>
    <!-- Иконки Font Awesome (галочки, сердечки, лупа и т.д.) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Шрифт Inter (предзагрузка и подключение) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Скрипт Яндекс.Карт (версия 2.1). Загружается асинхронно (async defer),
      поэтому глобальный объект `ymaps` появляется позже. Вся инициализация
      карты происходит внутри ymaps.ready(...) в конце скрипта и защищена
      флагом ymapsReady, чтобы не вызывать методы карты до готовности.
      apikey — ключ доступа к API Яндекса.
    -->
    <script
      src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=1523c569-fb40-448b-8a73-6e1a37b34216&loading=release"
      type="text/javascript"
      async
      defer
    ></script>
    <style>
      /* =======================================================================
         БЛОК СТИЛЕЙ (CSS)
         -----------------------------------------------------------------------
         Здесь описан весь внешний вид приложения. Основные цвета и размеры
         вынесены в CSS-переменные (в блоке :root), чтобы их было легко менять
         в одном месте. Ниже стили сгруппированы по экранам/блокам.
         ======================================================================= */

      /* Цветовая схема и базовые параметры (CSS-переменные).
         --primary        — основной синий цвет кнопок и акцентов
         --primary-dark   — тёмный оттенок для нажатия
         --page-bg        — фон всей страницы (ярко-синий)
         --card           — цвет карточек (белый)
         --text / --gray  — тёмный и серый цвета текста
         --input-bg       — фон полей ввода (светло-серый)
         --shadow-*       — мягкие тени для карточек и кнопок */
      :root {
        --primary: #5b75f8;
        --primary-dark: #4a5fe0;
        --page-bg: #5b75f8;
        --card: #ffffff;
        --text: #1f2937;
        --gray: #9ca3af;
        --border: #e5e7eb;
        --input-bg: #f0f2fa;
        --soft: #f9fafb;
        --green: #27ae60;
        --red: #e74c3c;
        --yellow: #ffd700;
        --shadow-card: 0 10px 30px rgba(17, 24, 39, 0.08);
        --shadow-soft: 0 4px 15px rgba(17, 24, 39, 0.1);
        --shadow-btn: 0 4px 12px rgba(91, 117, 248, 0.35);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* Базовые стили страницы: шрифт Inter, синий фон, тёмный текст.
         height:100dvh — высота экрана с учётом мобильных браузеров.
         overflow:hidden — запрещаем прокрутку всей страницы (скроллятся
         только внутренние блоки, например карточка скамейки). */
      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--page-bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #authScreen {
        /* Экран входа/регистрации. position:fixed + flex по центру делают
           его «полноэкранной карточкой» поверх всего. z-index:5000 ставит
           его выше карты. Класс .hidden (display:none) прячет экран после входа. */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--page-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        padding: 20px;
        overflow-y: auto;
      }
      #authScreen.hidden {
        display: none;
      }
      .auth-card {
        /* Белая карточка формы: скруглённые углы 20px и мягкая тень */
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 32px 28px;
        width: 100%;
        max-width: 400px;
      }
      .auth-logo {
        text-align: center;
        font-size: 3.5em;
        color: var(--primary);
        margin-bottom: 16px;
      }
      .auth-title {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
      }
      .auth-subtitle {
        text-align: center;
        font-size: 14px;
        color: var(--gray);
        margin-bottom: 24px;
      }
      .auth-tabs {
        /* Переключатель «Вход / Регистрация» в виде сегментированной кнопки */
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        background: var(--input-bg);
        padding: 5px;
        border-radius: 10px;
      }
      .auth-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        color: var(--gray);
        transition: 0.2s;
      }
      .auth-tab.active {
        background: var(--card);
        color: var(--primary);
        box-shadow: 0 2px 8px rgba(17, 24, 39, 0.08);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--gray);
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        background: var(--input-bg);
        color: var(--text);
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: var(--primary);
        background: #fff;
      }
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        transition: 0.2s;
      }
      .btn:active {
        background: var(--primary-dark);
      }
      .btn i {
        margin-right: 6px;
      }
      #mainApp {
        /* Основной экран с картой. Скрыт (display:none), пока не пройдён вход.
           Класс .active делает его видимым (flex). position:relative — база для
           абсолютного позиционирования карты и кнопок внутри. */
        display: none;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        position: relative;
      }
      #mainApp.active {
        display: flex;
      }
      #map {
        /* Контейнер Яндекс.Карты: занимает весь экран под mainApp */
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .search-container {
        /* Плавающая строка поиска сверху экрана поверх карты */
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        z-index: 2000;
      }
      .search-bar {
        /* Белая «пилюля» поиска с мягкой тенью */
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-soft);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .search-bar > i {
        color: var(--gray);
        font-size: 1em;
      }
      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 14px;
        color: var(--text);
        background: transparent;
        font-family: inherit;
      }
      .search-bar input::placeholder {
        color: var(--gray);
      }
      .search-btn {
        border: none;
        background: var(--primary);
        color: #fff;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1em;
        flex-shrink: 0;
      }
      #addressResults {
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        margin-top: 8px;
        max-height: calc(100vh - 350px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #searchResultsList {
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        z-index: 2500;
        max-height: 250px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: none;
        margin-top: 8px;
      }
      #searchResultsList.active {
        display: block;
      }
      .search-result-item {
        padding: 14px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search-result-item:last-child {
        border-bottom: none;
      }
      .search-result-item i {
        color: var(--primary);
        width: 20px;
      }
      .search-result-item .name {
        flex: 1;
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
      }
      .search-result-item .dist {
        color: var(--green);
        font-weight: 700;
        font-size: 13px;
      }
      .map-buttons {
        /* Плавающие кнопки действий (геолокация, добавить, профиль и т.д.).
           Прижаты к нижнему правому углу поверх карты. */
        position: absolute;
        right: 15px;
        bottom: 90px;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-btn {
        /* Отдельная круглая кнопка-«пилюля» белого цвета с тенью */
        position: relative;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow-soft);
        cursor: pointer;
        font-size: 1.1em;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        transition: 0.2s;
      }
      .map-btn:active {
        transform: scale(0.94);
      }
      .map-btn.primary {
        /* Главная кнопка (например, «добавить скамейку») — синяя */
        background: var(--primary);
        color: #fff;
        box-shadow: var(--shadow-btn);
      }
      .bench-card {
        /* Нижняя выезжающая карточка с деталями скамейки.
           По умолчанию сдвинута вниз (translateY(100%)) и скрыта; класс
           .active возвращает её на место. max-height + overflow делают
           карточку прокручиваемой, если контента много. */
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -6px 30px rgba(17, 24, 39, 0.18);
        z-index: 1500;
        max-height: 75vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: translateY(100%);
        transition: 0.3s;
      }
      .bench-card.active {
        transform: translateY(0);
      }
      .bench-card-handle {
        width: 44px;
        height: 5px;
        background: #d1d5db;
        border-radius: 3px;
        margin: 12px auto;
        cursor: pointer;
      }
      .bench-card-content {
        padding: 0 20px 20px;
      }
      .bench-card-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
      }
      .bench-card-title i {
        color: var(--primary);
        margin-right: 8px;
      }
      .bench-card-distance {
        color: var(--green);
        font-weight: 700;
        margin: 6px 0;
        font-size: 14px;
      }
      .bench-card-desc {
        color: var(--gray);
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .bench-card-photos {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 10px 0;
      }
      .bench-card-photos img {
        width: 160px;
        height: 160px;
        object-fit: cover;
        border-radius: 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .bench-card-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .bench-card-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
      }
      .bench-card-btn i {
        margin-right: 5px;
      }
      .btn-route {
        background: var(--primary);
        color: #fff;
      }
      .btn-reviews {
        background: var(--input-bg);
        color: var(--text);
      }
      .btn-fav {
        background: var(--input-bg);
        width: 50px;
        flex: none;
        color: var(--gray);
        font-size: 1.3em;
        cursor: pointer;
        border: none;
        border-radius: 12px;
      }
      .btn-fav.active {
        color: var(--red);
        background: #fdeceb;
      }
      .btn-report {
        background: var(--input-bg);
        width: 50px;
        flex: none;
        color: var(--gray);
        cursor: pointer;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
      }
      .btn-like {
        background: var(--input-bg);
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: none;
        font-size: 14px;
        font-family: inherit;
      }
      .btn-like.active {
        color: var(--primary);
        background: #eef1fe;
      }
      .close-btn {
        background: rgba(91, 117, 248, 0.12);
        border: none;
        color: var(--primary);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1em;
        flex-shrink: 0;
      }
      .modal {
        /* Всплывающее модальное окно (профиль, отзывы, добавить скамейку).
           Полупрозрачная подложка + центрированная карточка. Скрыто по
           умолчанию (display:none); класс .active показывает его. */
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(17, 24, 39, 0.45);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.active {
        display: flex !important;
      }
      .modal-content {
        /* Белая карточка содержимого модального окна */
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 24px;
        width: 100%;
        max-width: 500px;
        max-height: 85vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-header h2 {
        font-size: 20px;
        color: var(--text);
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 100000;
        font-weight: 600;
        font-size: 14px;
        box-shadow: var(--shadow-btn);
      }
      .overlay-modal {
        /* Небольшие всплывающие окна (уведомления, подтверждения, формы
           жалобы/отзыва). Похожи на .modal, но с более тёмной подложкой и
           меньшей карточкой. Создаются динамически в JavaScript. */
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(17, 24, 39, 0.5);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .overlay-box {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 28px 24px;
        text-align: center;
        max-width: 360px;
        max-height: 80vh;
        width: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .overlay-box h3 {
        font-size: 18px;
        color: var(--text);
        margin-bottom: 12px;
      }
      .review-item {
        padding: 16px;
        background: var(--soft);
        border-radius: 14px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
      }
      .profile-stat {
        flex: 1;
        text-align: center;
        padding: 16px;
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .profile-stat .v {
        font-size: 1.6em;
        font-weight: 700;
        color: var(--primary);
      }
      .profile-stat div:last-child {
        color: var(--gray);
        font-size: 13px;
        margin-top: 4px;
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--input-bg);
        margin: 5px;
        font-size: 13px;
        color: var(--text);
      }
      .section-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        margin: 20px 0 10px;
      }
      /* Кнопка "вверх" (прокрутка к верху) */
      #backToTop {
        display: none;
        position: absolute;
        bottom: 170px;
        left: 15px;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow-soft);
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        color: var(--gray);
        z-index: 1001;
      }
      #backToTop.show {
        display: flex;
      }
      /* Индикатор загрузки карты (показывается пока ymaps готовится) */
      #mapPreloader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--page-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        transition: opacity 0.3s;
      }
      #mapPreloader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #mapPreloader i {
        font-size: 3em;
        color: #fff;
        margin-bottom: 15px;
      }
      #mapPreloader .loading-text {
        color: #fff;
        font-size: 14px;
      }
      /* Панель уведомлений (выпадает из-под колокна) */
      .notifications-panel {
        position: absolute;
        bottom: 162px;
        right: 15px;
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        border: 1px solid var(--border);
        width: 300px;
        max-height: 400px;
        overflow-y: auto;
        z-index: 3000;
        display: none;
      }
      .notifications-panel.active {
        display: block;
      }
      .notifications-panel .notif-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .notifications-panel .notif-header h4 {
        font-size: 16px;
        font-weight: 700;
      }
      .notifications-panel .notif-clear {
        background: none;
        border: none;
        color: var(--gray);
        cursor: pointer;
        font-size: 13px;
      }
      .notifications-panel .notif-list {
        max-height: 320px;
        overflow-y: auto;
      }
      .notif-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
      }
      .notif-item:last-child {
        border-bottom: none;
      }
      .notif-item.unread {
        background: #f0f4ff;
      }
      .notif-item .notif-msg {
        font-size: 13px;
        color: var(--text);
        margin-bottom: 4px;
      }
      .notif-item .notif-time {
        font-size: 11px;
        color: var(--gray);
      }
      .notif-badge {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--red);
        color: #fff;
        border-radius: 50%;
        min-width: 18px;
        height: 18px;
        font-size: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px 4px;
        z-index: 1;
      }
      /* Аватары */
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--card);
        box-shadow: var(--shadow-soft);
      }
      .avatar-sm {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
      }
      .avatar-default {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.4em;
        border: 2px solid var(--card);
        box-shadow: var(--shadow-soft);
        object-fit: cover;
      }
      .avatar-default-sm {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.1em;
      }
      /* Ошибка поиска */
      .search-error {
        background: #fdecec;
        border: 1px solid var(--red);
        color: var(--red);
        border-radius: 12px;
        padding: 12px 16px;
        font-size: 13px;
        margin-top: 8px;
        display: none;
      }
      .search-error.active {
        display: block;
      }
      /* Скрытая колонка для swipe */
      .bench-card.hidden {
        display: none;
      }
      /* Анимация slideUp для карточки */
      .bench-card.slide-up {
        transition:
          transform 0.3s ease-out,
          opacity 0.3s ease-out;
      }
      /* Draggable marker overlay on map during bench creation */
      .marker-drag-overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10000;
        pointer-events: none;
      }
      .marker-drag-overlay i {
        font-size: 2.5em;
        color: var(--primary);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.2);
          opacity: 0.4;
        }
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
      }
      /* Admin comment badge in bench card */
      .admin-comment-badge {
        background: #fff3cd;
        border: 1px solid var(--yellow);
        color: #856404;
        border-radius: 10px;
        padding: 10px 14px;
        margin-top: 10px;
        font-size: 13px;
        line-height: 1.4;
      }
      .admin-comment-badge i {
        color: #856404;
        margin-right: 6px;
      }
      @media (min-width: 768px) {
        #mainApp {
          max-width: 480px;
          margin: 0 auto;
          box-shadow: 0 0 50px rgba(0, 0, 0, 0.25);
        }
        .auth-card {
          max-width: 420px;
        }
      }
    </style>
  </head>
  <body>
    <!--
      =====================================================================
      ТЕЛО СТРАНИЦЫ (HTML)
      Основные блоки:
        #authScreen  — экран входа/регистрации (прячется после авторизации)
        #mainApp     — основной экран: карта, поиск, кнопки, карточка скамейки
        Модальные окна (#reviewsModal, #profileModal, #addModal, #nearbyModal,
          #topModal) и динамические всплывающие окна (.overlay-modal)
      =====================================================================
    -->

    <!-- ЭКРАН ВХОДА: форма авторизации и регистрации -->
    <div id="authScreen">
      <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-location-dot"></i></div>
        <div class="auth-title">Скамейки Твери</div>
        <div class="auth-subtitle">
          Находите лучшие скамейки Твери рядом с вами
        </div>
        <div class="auth-tabs">
          <!-- Переключатели режима: показывают нужный блок ниже -->
          <div class="auth-tab active" onclick="showLogin()">Вход</div>
          <div class="auth-tab" onclick="showRegister()">Регистрация</div>
        </div>
        <!-- Блок входа. Поля loginLogin/loginPassword читаются в doLogin() -->
        <div id="loginBox">
          <div class="form-group">
            <label>Логин</label><input type="text" id="loginLogin" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="loginPassword" />
          </div>
          <button class="btn" onclick="doLogin()">Войти</button>
        </div>
        <!-- Блок регистрации (скрыт, пока не выбран таб «Регистрация»).
             Поля regLogin/regNickname/regPassword читаются в doRegister() -->
        <div id="registerBox" style="display: none">
          <div class="form-group">
            <label>Логин (англ.)</label><input type="text" id="regLogin" />
          </div>
          <div class="form-group">
            <label>Никнейм</label><input type="text" id="regNickname" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="regPassword" />
          </div>
          <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
        </div>
      </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН ПРИЛОЖЕНИЯ (карта + интерфейс).
         Становится видимым после успешного входа (класс .active). -->
    <div id="mainApp">
      <!-- Индикатор загрузки карты (показывается пока ymaps готовится) -->
      <div id="mapPreloader">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <div class="loading-text">Загрузка карты...</div>
      </div>
      <!-- Контейнер Яндекс.Карты (в него монтируется карта из JS) -->
      <div id="map"></div>
      <!-- Плавающая строка поиска сверху -->
      <div class="search-container">
        <div class="search-bar">
          <!-- searchInput — поле ввода; searchBenches() ищет по мере ввода,
               searchByAddress() ищет по нажатию кнопки -->
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            type="text"
            placeholder="Поиск по адресу..."
            id="searchInput"
            oninput="searchBenches()"
          /><button
            class="search-btn"
            onclick="searchByAddress()"
            id="searchBtn"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <!-- Сообщение об ошибке поиска -->
        <div class="search-error" id="searchError"></div>
        <!-- Список результатов поиска (заполняется из JS) -->
        <div id="searchResultsList"></div>
        <!-- Блок ближайших скамеек к введённому адресу -->
        <div id="addressResults" style="display: none"></div>
      </div>
      <!-- Выпадающая панель уведомлений -->
      <div class="notifications-panel" id="notificationsPanel">
        <div class="notif-header">
          <h4>Уведомления</h4>
          <button class="notif-clear" onclick="clearNotifications()">
            Очистить
          </button>
        </div>
        <div class="notif-list" id="notifList"></div>
      </div>
      <!-- Плавающие кнопки действий внизу справа -->
      <div class="map-buttons">
        <!-- Колоконь уведомлений -->
        <button
          class="map-btn"
          onclick="toggleNotifications()"
          id="notifBellBtn"
        >
          <i class="fa-solid fa-bell"></i>
          <span class="notif-badge" id="notifBadge" style="display: none"
            >0</span
          >
        </button>
        <!-- Определить моё местоположение -->
        <button class="map-btn" onclick="findMe()">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
        <!-- Скамейки рядом -->
        <button class="map-btn" onclick="showNearby()">
          <i class="fa-solid fa-chair"></i>
        </button>
        <!-- Добавить скамейку (главная, синяя) -->
        <button class="map-btn primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i>
        </button>
        <!-- Обновить список скамеек -->
        <button class="map-btn" onclick="loadBenches()">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <!-- Открыть профиль -->
        <button class="map-btn" onclick="openProfile()">
          <i class="fa-solid fa-user"></i>
        </button>
        <!-- Топ пользователей -->
        <button class="map-btn" onclick="openTopUsers()">
          <i class="fa-solid fa-trophy"></i>
        </button>
      </div>
      <!-- Выезжающая снизу карточка с деталями выбранной скамейки.
           Содержимое (benchCardContent) заполняется в showBenchCard().
           Полоска сверху (bench-card-handle) закрывает карточку по клику.
           Swipe-down также закрывает карточку (обрабатывается в JS). -->
      <div class="bench-card slide-up" id="benchCard">
        <div class="bench-card-handle" id="benchCardHandle"></div>
        <div class="bench-card-content" id="benchCardContent"></div>
      </div>
      <!-- Индикатор перетаскивания маркера при создании скамейки -->
      <div class="marker-drag-overlay" id="markerDragOverlay">
        <i class="fa-solid fa-map-pin"></i>
      </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: отзывы к скамейке (#reviewsContent заполняется в openReviews) -->
    <div id="reviewsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Отзывы</h2>
        </div>
        <div id="reviewsContent"></div>
      </div>
    </div>
    <!-- МОДАЛЬНОЕ ОКНО: профиль пользователя -->
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Профиль</h2>
        </div>
        <div id="profileContent"></div>
      </div>
    </div>
    <div id="addModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Новая скамейка</h2>
        </div>
        <div id="addModalContent"></div>
      </div>
    </div>
    <div id="nearbyModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Поблизости</h2>
        </div>
        <div id="nearbyContent"></div>
      </div>
    </div>
    <div id="topModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Топ</h2>
        </div>
        <div id="topContent"></div>
      </div>
    </div>

    <!--
      =====================================================================
      СКРИПТ (JavaScript) — вся логика интерфейса
      ---------------------------------------------------------------------
      Здесь: глобальные переменные, работа с Яндекс.Картами, авторизация,
      поиск, отзывы, избранное/лайки, жалобы, профиль, модальные окна.
      Все функции описаны ниже с пояснениями.
      =====================================================================
    -->
    <script>
      // ---- Глобальные переменные (доступны из всех функций) --------------
      // currentUser  — данные вошедшего пользователя (или null, если не вошёл)
      // userPosition — координаты пользователя {lat, lng}, полученные от GPS
      // myMap        — объект карты Яндекс (создаётся в ymaps.ready)
      // userPlacemark— метка текущего местоположения на карте
      // allBenches   — массив всех загруженных скамеек (для поиска/фильтрации)
      // selectedBench— скамейка, открытая сейчас в нижней карточке
      // searchResults— результаты поиска по адресу
      // searchTimeout— таймер для «отложенного» поиска (чтобы не дёргать API
      //                на каждую введённую букву)
      // reviewRating — выбранная оценка при написании отзыва (1–5)
      var currentUser = null,
        userPosition = null,
        myMap = null,
        mapInitialized = false,
        userPlacemark = null,
        allBenches = [],
        selectedBench = null,
        searchResults = [],
        searchTimeout = null,
        reviewRating = 0,
        profileInterval = null,
        dragPlacemark = null,
        isDraggingMarker = false;
      if (window.Telegram && window.Telegram.WebApp) {
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          var overlays = document.querySelectorAll(".overlay-modal");
          if (overlays.length > 0) {
            overlays[overlays.length - 1].remove();
            return;
          }
          var modals = [
            "reviewsModal",
            "profileModal",
            "addModal",
            "nearbyModal",
            "topModal",
          ];
          for (var i = 0; i < modals.length; i++) {
            var el = document.getElementById(modals[i]);
            if (el && el.classList.contains("active")) {
              el.classList.remove("active");
              return;
            }
          }
          var benchCard = document.getElementById("benchCard");
          if (benchCard && benchCard.classList.contains("active")) {
            benchCard.classList.remove("active");
            return;
          }
          tg.BackButton.hide();
        });
      }
      // ---- Фильтр нецензурной лексики ------------------------------------
      // Список запрещённых слов. Используется, чтобы не публиковать мат в
      // никнеймах и отзывах. Проверка регистронезависимая.
      var badWords = [
        "блять",
        "сука",
        "хуй",
        "пизда",
        "ебать",
        "нахуй",
        "хер",
        "мудак",
        "пидор",
        "шлюха",
        "жопа",
        "говно",
        "дерьмо",
        "тварь",
        "мразь",
        "сволочь",
        "чмо",
        "лох",
        "дебил",
        "идиот",
        "дурак",
        "тупой",
        "урод",
        "мразь",
        "Путин",
      ];
      // containsBadWords(t): возвращает true, если в тексте t есть запрещённое слово
      function containsBadWords(t) {
        if (!t) return false;
        var l = t.toLowerCase();
        for (var i = 0; i < badWords.length; i++) {
          if (l.indexOf(badWords[i]) > -1) return true;
        }
        return false;
      }
      // isValidLatin(s): проверяет, что логин состоит только из латиницы,
      // цифр и подчёркивания (по требованию регистрации)
      function isValidLatin(s) {
        return /^[a-zA-Z0-9_]+$/.test(s);
      }
      // escapeHtml(text): «безопасно» вставляет пользовательский текст в HTML,
      // экранируя спецсимволы (защита от вставки скриптов/разметки)
      function escapeHtml(text) {
        if (!text) return "";
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
      // avatarHtml(url, name, size): возвращает HTML <img> с аватаром или
      // заглушку с инициалами, если аватар не задан.
      // size: 'sm' (32px) или 'lg' (40px)
      function avatarHtml(url, name, size) {
        var cls = size === "sm" ? "avatar-sm" : "avatar";
        var defCls = size === "sm" ? "avatar-default-sm" : "avatar-default";
        if (url) {
          var u = url;
          if (u.indexOf("/") === 0) u = window.location.origin + u;
          return '<img src="' + u + '" class="' + cls + '" alt="avatar">';
        }
        var initial = name ? name.charAt(0).toUpperCase() : "?";
        return '<div class="' + defCls + '">' + initial + "</div>";
      }
      // authHeaders(): формирует заголовки для запросов, требующих авторизации.
      // Добавляет токен в виде "Bearer <токен>", если пользователь вошёл.
      function authHeaders() {
        var headers = {};
        if (currentUser && currentUser.token) {
          headers["Authorization"] = "Bearer " + currentUser.token;
        }
        return headers;
      }
      function closeModal(id) {
        // Прячет модальное окно, убирая у него класс "active"
        document.getElementById(id).classList.remove("active");
        // Очистка при закрытии модального окна добавления скамейки
        if (id === "addModal") {
          if (dragPlacemark && myMap) {
            myMap.geoObjects.remove(dragPlacemark);
            dragPlacemark = null;
          }
          var overlay = document.getElementById("markerDragOverlay");
          if (overlay) overlay.style.display = "none";
        }
        // Закрываем панель уведомлений при закрытии любого модального окна
        var panel = document.getElementById("notificationsPanel");
        if (panel && panel.classList.contains("active")) {
          panel.classList.remove("active");
        }
      }
      // Клик по затемнённой подложке модального окна (но не по самой карточке)
      // закрывает окно — удобно для мобильных, где нет крестика.
      document.querySelectorAll(".modal").forEach(function (m) {
        m.addEventListener("click", function (e) {
          if (e.target === m) {
            m.classList.remove("active");
          }
        });
      });

      // ---- РАБОТА С ЯНДЕКС.КАРТАМИ ----------------------------------------
      // createBenchIcon(): возвращает настройки метки для скамейки.
      // Иконка задана как готовая картинка (SVG-скамейка в base64),
      // а не стандартная булавка, чтобы скамейки выглядели узнаваемо.
      function createBenchIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="8" y="40" width="48" height="5" rx="2.5" fill="#5b75f8"/><rect x="12" y="18" width="40" height="5" rx="2.5" fill="#7c8ffb"/><rect x="10" y="18" width="5" height="27" rx="2.5" fill="#3f57d6"/><rect x="49" y="18" width="5" height="27" rx="2.5" fill="#3f57d6"/><rect x="8" y="45" width="5" height="14" rx="2.5" fill="#3f57d6"/><rect x="51" y="45" width="5" height="14" rx="2.5" fill="#3f57d6"/></svg>',
            ),
          iconImageSize: [40, 40],
          iconImageOffset: [-20, -40], // смещение, чтобы «носик» метки был в точке
        };
      }
      // createUserIcon(): метка текущего местоположения пользователя (синяя булавка)
      function createUserIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M32 2 C18 14 8 26 8 40 C8 53 18 62 32 62 C46 62 56 53 56 40 C56 26 46 14 32 2 Z" fill="#5b75f8" stroke="white" stroke-width="2"/><circle cx="32" cy="38" r="13" fill="white"/><circle cx="32" cy="38" r="7" fill="#5b75f8"/></svg>',
            ),
          iconImageSize: [45, 45],
          iconImageOffset: [-22, -45],
        };
      }
      // ymaps.ready(...) — запускается, когда карта полностью загрузилась.
      // Создаём объект карты в контейнере #map, центрируем на Твери (zoom 13),
      // скрываем прелоудер и сразу загружаем скамейки.
      var hidePreloader = function () {
        var pre = document.getElementById("mapPreloader");
        if (pre) {
          pre.classList.add("hide");
          setTimeout(function () {
            if (pre.parentNode) pre.parentNode.removeChild(pre);
          }, 300);
        }
      };
      ymaps.ready(function () {
         mapInitialized = true;
         myMap = new ymaps.Map("map", {
           center: [56.8587, 35.9176],
           zoom: 13,
           controls: [],
         });
         try { myMap.container.fit(); } catch (e) {}
         hidePreloader();
         loadBenches();
        
         // Try to find user location after map is ready
         findMe();
 });

      // ---- ПЕРЕКЛЮЧЕНИЕ ФОРМ ВХОДА/РЕГИСТРАЦИИ ---------------------------
      // showLogin(): показывает блок входа, прячет регистрацию
      function showLogin() {
        document.querySelectorAll(".auth-tab")[0].classList.add("active");
        document.querySelectorAll(".auth-tab")[1].classList.remove("active");
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("registerBox").style.display = "none";
      }
      // showRegister(): наоборот, показывает регистрацию
      function showRegister() {
        document.querySelectorAll(".auth-tab")[1].classList.add("active");
        document.querySelectorAll(".auth-tab")[0].classList.remove("active");
        document.getElementById("registerBox").style.display = "block";
        document.getElementById("loginBox").style.display = "none";
      }
      function showToast(m) {
        var o = document.querySelector(".toast");
        if (o) o.remove();
        var t = document.createElement("div");
        t.className = "toast";
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(function () {
          t.remove();
        }, 3000);
      }
      function showOverlay(icon, color, title, msg) {
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box"><div style="font-size:3em;color:' +
          color +
          ';margin-bottom:15px"><i class="fa-solid ' +
          icon +
          '"></i></div><h3>' +
          escapeHtml(title) +
          '</h3><p style="color:var(--gray);margin:10px 0 20px">' +
          escapeHtml(msg) +
          '</p><button class="btn" onclick="this.closest(\'.overlay-modal\').remove()">OK</button></div>';
        o.addEventListener("click", function (e) {
          if (e.target === o) o.remove();
        });
        document.body.appendChild(o);
      }
      function createOverlayModal(contentHtml) {
        var o = document.createElement("div");

      // ---- РЕГИСТРАЦИЯ ----------------------------------------------------
      // doRegister(): считывает поля регистрации, проверяет их (латиница

      function doRegister() {
        var l = document.getElementById("regLogin").value.trim(),
          n = document.getElementById("regNickname").value.trim(),
          p = document.getElementById("regPassword").value;
        if (!l || !n || !p) {

          return;

        fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },

        })
          .then(function (r) {

          })
          .then(function (d) {

      // ---- ВХОД ------------------------------------------------------------
      // doLogin(): отправляет логин/пароль на POST /api/login. При успехе

      // показывает карту и через секунду определяет местоположение.
      function doLogin() {
        var l = document.getElementById("loginLogin").value.trim(),

          showToast("Введите данные");
          return;

        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: l, password: p }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              currentUser = d.user;
              currentUser.token = d.token;

      // пользователь в localStorage. Если да — сразу открывает карту (не надо
      // входить заново), иначе остаётся экран входа.
      function checkAuth() {
         var s = localStorage.getItem("tver_user");
         if (s) {
           try { currentUser = JSON.parse(s); } catch (e) { currentUser = null; }

      // refreshMap(): если карта уже инициализирована (но контейнер был скрыт),
      // заставляем её перестроиться. Если ещё не готова — ymaps.ready сделает это.
      function refreshMap() {
        if (myMap && mapInitialized) {
          setTimeout(function () {
            if (myMap && typeof myMap.container !== "undefined" && myMap.container.fit) {
              try { myMap.container.fit(); } catch (e) {}

      // findMe(): запрашивает геопозицию браузера (GPS/WiFi). При успехе
      // сохраняет координаты в userPosition и ставит синюю метку на карте,
      // центрируя её на пользователе.
      function findMe() {
        if (navigator.geolocation && mapInitialized && myMap) {
          navigator.geolocation.getCurrentPosition(
            function (pos) {
              userPosition = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              };
              if (userPlacemark) myMap.geoObjects.remove(userPlacemark);
              userPlacemark = new ymaps.Placemark(
                [userPosition.lat, userPosition.lng],
                {},
                createUserIcon(),
              );
              myMap.geoObjects.add(userPlacemark);
              myMap.setCenter([userPosition.lat, userPosition.lng], 16);

            function () {

      // loadBenches(): загружает все активные скамейки (GET /api/benches),

      // пометил, какие скамейки лайкнуты/в избранном у текущего пользователя.
      function loadBenches() {
        if (!mapInitialized || !myMap) return;
        fetch(
          "/api/benches?user_id=" +
            (currentUser && currentUser.id ? currentUser.id : ""),
        )
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.success) return;
            allBenches = d.benches;
            myMap.geoObjects.removeAll();
            if (userPlacemark) {

      // showBenchCard(b): открывает нижнюю карточку с деталями скамейки b.

        // Комментарий админа (для отклонённых скамеек)

          authorAvatar +

          '<div class="bench-card-distance"><i class="fa-solid fa-location-arrow"></i> ' +
          dist +
          "</div></div>" +
          (b.description
            ? '<div class="bench-card-desc">' +
              escapeHtml(b.description) +
              "</div>"
            : "") +
          adminComment +
          ph +
          '<div class="bench-card-actions"><button class="bench-card-btn btn-route" onclick="buildRoute()"><i class="fa-solid fa-route"></i>Маршрут</button><button class="bench-card-btn btn-reviews" onclick="openReviews(' +
          b.id +
          ')"><i class="fa-solid fa-comments"></i>Отзывы</button><button class="btn-fav' +
          (b.favorited ? " active" : "") +

      // ---- Bench card swipe-to-close -----------------------------------------
      // Закрытие карточки скамейки: на мобильных — свайп вниз по полоске
      // сверху; на десктопе — клик по полоске или протягивание вниз мышью.
      var swipeStartY = 0,
        swipeStartX = 0,
        swipeThreshold = 60,
        swipeDragging = false;
      function initBenchCardSwipe() {
        var handle = document.getElementById("benchCardHandle");
        if (!handle) return;
        // Десктоп: клик по полоске закрывает карточку
        handle.addEventListener("click", function () { closeBenchCard(); });
        handle.addEventListener("mousedown", onSwipeStart);
        handle.addEventListener("touchstart", onSwipeStart, { passive: true });
        function onSwipeStart(e) {
          swipeDragging = true;
          var touch = e.touches ? e.touches[0] : e;
          swipeStartY = touch.clientY;
          swipeStartX = touch.clientX;
          if (e.cancelable) e.preventDefault();
          // Слушаем на document, т.к. на десктопе курсор быстро уходит
          // за пределы тонкой полоски и mousemove на ней перестаёт приходить.
          document.addEventListener("mousemove", moveFn);
          document.addEventListener("mouseup", endFn);
          document.addEventListener("touchmove", moveFn, { passive: true });
          document.addEventListener("touchend", endFn);
        }
        function moveFn(ev) {
          if (!swipeDragging) return;
          var t = ev.touches ? ev.touches[0] : ev;
          var dy = t.clientY - swipeStartY;
          if (dy > swipeThreshold) {
            closeBenchCard();
            cleanup();
          }
        }
        function endFn() {
          cleanup();
        }
        function cleanup() {
          swipeDragging = false;
          document.removeEventListener("mousemove", moveFn);
          document.removeEventListener("mouseup", endFn);
          document.removeEventListener("touchmove", moveFn);
          document.removeEventListener("touchend", endFn);
        }
      }
      function closeBenchCard() {

      // ---- СИСТЕМА ЛАЙКОВ -------------------------------------------------

      function searchByAddress() {
        clearTimeout(searchTimeout);
        if (typeof ymaps === "undefined" || !ymaps.geocode) {
          var errEl = document.getElementById("searchError");
          if (errEl) {
            errEl.textContent = "Карта ещё не загружена. Подождите...";
            errEl.classList.add("active");
          }
          return;
        }
        var q = document.getElementById("searchInput").value.trim();
        var errEl = document.getElementById("searchError");
        if (errEl) errEl.classList.remove("active");
        if (!q || q.length < 2) {
          showToast("Введите адрес");
          return;
        }
        document.getElementById("searchResultsList").classList.remove("active");
        var addrList = document.getElementById("addressResults");
        addrList.innerHTML =
          '<p style="padding:15px;color:var(--gray)">Поиск ближайших скамеек...</p>';
        addrList.style.display = "block";
        ymaps
          .geocode("Тверь, " + q, { results: 1 })
          .then(function (res) {
            var firstResult = res.geoObjects.get(0);
            if (!firstResult) {
              addrList.innerHTML = "";
              if (errEl) {
                errEl.textContent = "Адрес не найден. Проверьте написание.";
                errEl.classList.add("active");
              }
              return;
            }
            var c = firstResult.geometry.getCoordinates();
            var results = [];
            allBenches.forEach(function (b) {
              var dd = calcDist(c[0], c[1], b.latitude, b.longitude);
              if (dd <= 5) {
                results.push({
                  name: b.description || "Скамейка",
                  dist:
                    dd < 1
                      ? Math.round(dd * 1000) + " м"
                      : dd.toFixed(1) + " км",
                  bench: b,
                  _dist: dd,
                });
              }
            });
            results.sort(function (a, b) {
              return a._dist - b._dist;
            });
            if (!results.length) {
              addrList.innerHTML = "";
              if (errEl) {
                errEl.textContent = "Нет скамеек в радиусе 5 км";
                errEl.classList.add("active");
              }
              return;
            }
            addrList.innerHTML = results
              .slice(0, 10)
              .map(function (r) {
                return (
                  '<div class="search-result-item" onclick="goToBench(' +
                  r.bench.id +
                  ')">' +
                  '<i class="fa-solid fa-chair"></i>' +
                  '<span class="name">' +
                  escapeHtml(r.name) +
                  "</span>" +
                  '<span class="dist">' +
                  r.dist +
                  "</span>" +
                  "</div>"
                );
              })
              .join("");
            if (myMap) myMap.setCenter([c[0], c[1]], 14);
          })
          .catch(function () {
            addrList.innerHTML = "";
            if (errEl) {
              errEl.textContent = "Ошибка поиска. Попробуйте позже.";
              errEl.classList.add("active");
            }
          });
      }

      function searchBenches() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(function () {
          var errEl = document.getElementById("searchError");
          if (errEl) errEl.classList.remove("active");
          var q = document.getElementById("searchInput").value.trim();
          if (!q || q.length < 2) {
            document
              .getElementById("searchResultsList")
              .classList.remove("active");
            return;
          }
          var list = document.getElementById("searchResultsList");
          list.innerHTML =
            '<p style="padding:14px;color:var(--gray)">Поиск...</p>';
          list.classList.add("active");
          ymaps
            .geocode("Тверь, " + q, { results: 10 })
            .then(function (res) {
              searchResults = [];
              var firstResult = res.geoObjects.get(0);
              if (firstResult) {
                var c = firstResult.geometry.getCoordinates();
                allBenches.forEach(function (b) {
                  var dd = calcDist(c[0], c[1], b.latitude, b.longitude);
                  if (dd <= 5) {
                    searchResults.push({
                      name: b.description || "Скамейка",
                      dist:
                        dd < 1
                          ? Math.round(dd * 1000) + " м"
                          : dd.toFixed(1) + " км",
                      bench: b,
                      _dist: dd,
                    });
                  }
                });
                searchResults.sort(function (a, b) {
                  return a._dist - b._dist;
                });
              }
              showSearchResults();
            })
            .catch(function (e) {
              list.classList.remove("active");
            });
        }, 500);
      }
      function showSearchResults() {
        var l = document.getElementById("searchResultsList");
        l.innerHTML = "";
        if (!searchResults.length) {
          l.classList.remove("active");
          return;
        }
        searchResults.slice(0, 8).forEach(function (r) {
          var d = document.createElement("div");
          d.className = "search-result-item";
          d.innerHTML =
            '<i class="fa-solid fa-chair"></i><span class="name">' +
            escapeHtml(r.name) +
            '</span><span class="dist">' +
            r.dist +
            "</span>";
          d.onclick = function () {
            l.classList.remove("active");
            if (myMap)
              myMap.setCenter([r.bench.latitude, r.bench.longitude], 17);
            showBenchCard(r.bench);
          };
          l.appendChild(d);
        });
        l.classList.add("active");
      }
      function calcDist(a, b, c, d) {
        var R = 6371,
          dLat = ((c - a) * Math.PI) / 180,
          dLon = ((d - b) * Math.PI) / 180;
        var x =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((a * Math.PI) / 180) *
            Math.cos((c * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }

      function saveBench() {
        var d = document.getElementById("modalBenchDesc").value.trim(),
          f = document.getElementById("modalPhotoInput").files;
        if (!f.length) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Фото обязательно!");
          return;
        }
        if (!userPosition) {
          showToast("Сначала определите геопозицию");
          return;
        }
        if (containsBadWords(d)) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Мат!");
          return;
        }
        var fd = new FormData();
        fd.append("description", d);
        fd.append("latitude", userPosition.lat);
        fd.append("longitude", userPosition.lng);
        fd.append("user_name", currentUser.nickname);
        for (var i = 0; i < f.length; i++) {
          fd.append("photos", f[i]);
        }
        fetch("/api/benches", {
          method: "POST",
          headers: authHeaders(),
          body: fd,
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              closeModal("addModal");
              showToast("Отправлено на модерацию!");
            } else {
              showOverlay(
                "fa-xmark",
                "#e74c3c",
                "Ошибка",
                d.error || "Не удалось добавить",
              );
            }
          })
          .catch(function () {
            showOverlay(
              "fa-xmark",
              "#e74c3c",
              "Ошибка",
              "Ошибка соединения с сервером",
            );
          });
      }

        document.body.appendChild(o);
      }
      // saveProfile(): отправляет изменения профиля на сервер
      function saveProfile() {
        var nick = document.getElementById("editNickname").value.trim();
        var phone = document.getElementById("editPhone").value.trim();
        var email = document.getElementById("editEmail").value.trim();
        if (!nick) {
          showToast("Введите никнейм");
          return;
        }
        if (containsBadWords(nick)) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Мат в никнейме!");
          return;
        }
        var fd = new FormData();
        fd.append("nickname", nick);
        fd.append("phone", phone);
        fd.append("email", email);
        var avatarFile = document.getElementById("editAvatarInput").files;
        if (avatarFile.length) {
          fd.append("avatar", avatarFile[0]);
        }
        // Сначала загружаем аватар (если выбран), потом обновляем профиль
        var avatarUrl = currentUser.avatar;
        if (avatarFile.length) {
          uploadAvatar(fd)
            .then(function () {
              updateUser(nick, phone, email);
            })
            .catch(function () {
              showOverlay(
                "fa-xmark",
                "#e74c3c",
                "Ошибка",
                "Не удалось загрузить аватар",
              );
            });
        } else {
          updateUser(nick, phone, email);
        }
        function updateUser(n, p, e) {
          var form = new FormData();
          form.append("nickname", n);
          form.append("phone", p);
          form.append("email", e);
          fetch("/api/user/" + currentUser.id, {
            method: "POST",
            headers: authHeaders(),
            body: form,
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (d) {
              document.querySelectorAll(".overlay-modal").forEach(function (e) {
                e.remove();
              });
              if (d.success) {
                currentUser.nickname = n;
                currentUser.phone = p;
                currentUser.email = e;
                localStorage.setItem("tver_user", JSON.stringify(currentUser));
                showToast("Сохранено!");
                // Refresh profile after short delay
                setTimeout(function () {
                  if (document.getElementById("profileContent")) {
                    renderProfile();
                  }
                }, 300);
              } else {
                showToast(d.error || "Ошибка сохранения");
              }
            })
            .catch(function () {
              showToast("Ошибка соединения с сервером");
            });
        }
      }
      // uploadAvatar(): загружает аватар на сервер и возвращает URL
      function uploadAvatar(fd) {
        return fetch("/api/user/avatar", {
          method: "POST",
          headers: authHeaders(),
          body: fd,
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success && d.avatar) {
              currentUser.avatar = d.avatar;
              localStorage.setItem("tver_user", JSON.stringify(currentUser));
              return d.avatar;
            }
            throw new Error(d.error || "Upload failed");
          });
      }
      function loadUserNotifications() {
        if (!currentUser) return;
        fetch("/api/user/" + currentUser.id + "/notifications", {
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var box = document.getElementById("userNotifBox");
            if (!box) return;
            if (!d.notifications || !d.notifications.length) {
              box.innerHTML =
                '<p style="color:var(--gray)">Нет уведомлений</p>';
              return;
            }
            box.innerHTML = d.notifications
              .map(function (n) {
                var cls = n.read
                  ? ""
                  : " style='background:#f0f4ff;border-radius:8px;padding:8px;margin:-8px -8px 8px -8px'";
                return (
                  '<div class="notif-item"' +
                  cls +
                  '><div class="notif-msg">' +
                  escapeHtml(n.message) +
                  "</div><div class='notif-time'>" +
                  (n.created_at || "") +
                  "</div></div>"
                );
              })
              .join("");
            // Обновляем бейджик колокна
            var badge = document.getElementById("notifBadge");
            if (badge) {
              var unread = d.notifications.filter(function (n) {
                return !n.read;
              });
              if (unread.length) {
                badge.textContent = unread.length;
                badge.style.display = "inline-block";
              } else {
                badge.style.display = "none";
              }
            }
          });
      }
      function clearUserNotifications() {
        if (!currentUser) return;
        if (!confirm("Очистить прочитанные уведомления?")) return;
        fetch("/api/user/" + currentUser.id + "/notifications/clear", {
          method: "POST",
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              loadUserNotifications();
              updateNotifBadge();
            }
          });
      }
      function updateNotifBadge() {
        if (!currentUser) return;
        fetch("/api/user/" + currentUser.id + "/notifications", {
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var badge = document.getElementById("notifBadge");
            if (!badge) return;
            if (d.notifications) {
              var unread = d.notifications.filter(function (n) {
                return !n.read;
              });
              if (unread.length) {
                badge.textContent = unread.length;
                badge.style.display = "inline-block";
              } else {
                badge.style.display = "none";
              }
            }
          });
      }
      function toggleNotifications() {
        var panel = document.getElementById("notificationsPanel");
        if (!panel) return;
        if (panel.classList.contains("active")) {
          panel.classList.remove("active");
        } else {
          if (!currentUser) {
            showToast("Войдите");
            return;
          }
          // Position panel relative to bell button
          var bell = document.getElementById("notifBellBtn");
          if (bell) {
            var rect = bell.getBoundingClientRect();
            panel.style.bottom = (window.innerHeight - rect.top + 12) + "px";
            panel.style.right = (window.innerWidth - rect.right) + "px";
          }
          panel.classList.add("active");
          loadNotificationsPanel();
        }
      }
      function loadNotificationsPanel() {
        if (!currentUser) return;
        fetch("/api/user/" + currentUser.id + "/notifications", {
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var list = document.getElementById("notifList");
            if (!list) return;
            if (!d.notifications || !d.notifications.length) {
              list.innerHTML =
                '<p style="color:var(--gray);padding:10px;text-align:center">Нет уведомлений</p>';
              return;
            }
            d.notifications.forEach(function (n) {
              n._read = true;
            });
            // Mark all as read
            fetch("/api/user/" + currentUser.id + "/notifications/read", {
              method: "POST",
              headers: authHeaders(),
            });
            list.innerHTML = d.notifications
              .map(function (n) {
                return (
                  '<div class="notif-item">' +
                  '<div class="notif-msg">' +
                  escapeHtml(n.message) +
                  "</div>" +
                  '<div class="notif-time">' +
                  (n.created_at || "") +
                  "</div></div>"
                );
              })
              .join("");
            var badge = document.getElementById("notifBadge");
            if (badge) badge.style.display = "none";
          });
      }
      function removeReport(id, btn) {
        if (!confirm("Убрать жалобу из списка?")) return;
        fetch("/api/user/reports/" + id, {
          method: "DELETE",
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              var item = btn.closest(".review-item");
              if (item) item.remove();
              showToast("Убрано из списка");
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function reportReview(reviewId, benchId) {
        if (!currentUser) {
          showToast("Войдите");
          return;
        }
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box"><h3>Жалоба на отзыв</h3><div class="form-group" style="text-align:left"><label>Причина</label><select id="reviewReportReason" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"><option value="spam">Спам</option><option value="insult">Оскорбление</option><option value="fake">Неточная информация</option></select></div><button class="btn" onclick="sendReviewReport(' +
          reviewId +
          ", " +
          benchId +
          ')">Отправить</button></div>';
        document.body.appendChild(o);
      }
      function sendReviewReport(reviewId, benchId) {
        var reason = document.getElementById("reviewReportReason").value;
        fetch("/api/reviews/" + reviewId + "/report", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            authHeaders(),
          ),
          body: JSON.stringify({ user_id: currentUser.id, reason: reason }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              document.querySelectorAll(".overlay-modal").forEach(function (e) {
                e.remove();
              });
              showToast("Жалоба отправлена");
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function logout() {
        currentUser = null;
        localStorage.removeItem("tver_user");
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.remove("active");
        closeModal("profileModal");
        // Скрываем колоконь уведомлений и панель
        var badge = document.getElementById("notifBadge");
        if (badge) badge.style.display = "none";
        var panel = document.getElementById("notificationsPanel");
        if (panel && panel.classList.contains("active"))
          panel.classList.remove("active");
      }
      var initialViewportHeight = window.innerHeight;
      window.addEventListener("resize", function () {
        if (window.innerHeight < initialViewportHeight * 0.7) {
          document.getElementById("authScreen").style.height =
            window.innerHeight + "px";
          document.getElementById("mainApp").style.height =
            window.innerHeight + "px";
        } else {
          document.getElementById("authScreen").style.height = "";
          document.getElementById("mainApp").style.height = "";
        }
      });
      checkAuth();
      // Инициализируем swipe-to-close для карточки скамейки
      setTimeout(function () {
        initBenchCardSwipe();
      }, 500);
      // Периодически обновляем бейджик уведомлений
      setInterval(function () {
        if (currentUser) {
          updateNotifBadge();
        }
      }, 30000);
    </script>
  </body>
</html>
