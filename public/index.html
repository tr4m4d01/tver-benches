<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Скамейки Твери</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=1523c569-fb40-448b-8a73-6e1a37b34216"
      type="text/javascript"
    ></script>
    <style>
      :root {
        --primary: #5b75f8;
        --primary-dark: #4a5fe0;
        --page-bg: #5b75f8;
        --card: #ffffff;
        --text: #1f2937;
        --gray: #9ca3af;
        --border: #e5e7eb;
        --input-bg: #f0f2fa;
        --soft: #f9fafb;
        --green: #27ae60;
        --red: #e74c3c;
        --yellow: #ffd700;
        --shadow-card: 0 10px 30px rgba(17, 24, 39, 0.08);
        --shadow-soft: 0 4px 15px rgba(17, 24, 39, 0.1);
        --shadow-btn: 0 4px 12px rgba(91, 117, 248, 0.35);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        background: var(--page-bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #authScreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--page-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        padding: 20px;
        overflow-y: auto;
      }
      #authScreen.hidden {
        display: none;
      }
      .auth-card {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 32px 28px;
        width: 100%;
        max-width: 400px;
      }
      .auth-logo {
        text-align: center;
        font-size: 3.5em;
        color: var(--primary);
        margin-bottom: 16px;
      }
      .auth-title {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
      }
      .auth-subtitle {
        text-align: center;
        font-size: 14px;
        color: var(--gray);
        margin-bottom: 24px;
      }
      .auth-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        background: var(--input-bg);
        padding: 5px;
        border-radius: 10px;
      }
      .auth-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        color: var(--gray);
        transition: 0.2s;
      }
      .auth-tab.active {
        background: var(--card);
        color: var(--primary);
        box-shadow: 0 2px 8px rgba(17, 24, 39, 0.08);
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--gray);
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        background: var(--input-bg);
        color: var(--text);
        font-family: inherit;
      }
      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        border-color: var(--primary);
        background: #fff;
      }
      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
        font-family: inherit;
        transition: 0.2s;
      }
      .btn:active {
        background: var(--primary-dark);
      }
      .btn i {
        margin-right: 6px;
      }
      #mainApp {
        display: none;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        position: relative;
      }
      #mainApp.active {
        display: flex;
      }
      #map {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      .search-container {
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        z-index: 2000;
      }
      .search-bar {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-soft);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .search-bar > i {
        color: var(--gray);
        font-size: 1em;
      }
      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 14px;
        color: var(--text);
        background: transparent;
        font-family: inherit;
      }
      .search-bar input::placeholder {
        color: var(--gray);
      }
      .search-btn {
        border: none;
        background: var(--primary);
        color: #fff;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1em;
        flex-shrink: 0;
      }
      #addressResults {
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        margin-top: 8px;
        max-height: calc(100vh - 350px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #searchResultsList {
        background: var(--card);
        border-radius: 16px;
        box-shadow: var(--shadow-soft);
        z-index: 2500;
        max-height: 250px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: none;
        margin-top: 8px;
      }
      #searchResultsList.active {
        display: block;
      }
      .search-result-item {
        padding: 14px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .search-result-item:last-child {
        border-bottom: none;
      }
      .search-result-item i {
        color: var(--primary);
        width: 20px;
      }
      .search-result-item .name {
        flex: 1;
        font-weight: 600;
        font-size: 14px;
        color: var(--text);
      }
      .search-result-item .dist {
        color: var(--green);
        font-weight: 700;
        font-size: 13px;
      }
      .map-buttons {
        position: absolute;
        right: 15px;
        bottom: 90px;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .map-btn {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow-soft);
        cursor: pointer;
        font-size: 1.1em;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        transition: 0.2s;
      }
      .map-btn:active {
        transform: scale(0.94);
      }
      .map-btn.primary {
        background: var(--primary);
        color: #fff;
        box-shadow: var(--shadow-btn);
      }
      .bench-card {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--card);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -6px 30px rgba(17, 24, 39, 0.18);
        z-index: 1500;
        max-height: 75vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: translateY(100%);
        transition: 0.3s;
      }
      .bench-card.active {
        transform: translateY(0);
      }
      .bench-card-handle {
        width: 44px;
        height: 5px;
        background: #d1d5db;
        border-radius: 3px;
        margin: 12px auto;
        cursor: pointer;
      }
      .bench-card-content {
        padding: 0 20px 20px;
      }
      .bench-card-title {
        font-size: 20px;
        font-weight: 700;
        color: var(--text);
      }
      .bench-card-title i {
        color: var(--primary);
        margin-right: 8px;
      }
      .bench-card-distance {
        color: var(--green);
        font-weight: 700;
        margin: 6px 0;
        font-size: 14px;
      }
      .bench-card-desc {
        color: var(--gray);
        margin-bottom: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .bench-card-photos {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 10px 0;
      }
      .bench-card-photos img {
        width: 160px;
        height: 160px;
        object-fit: cover;
        border-radius: 12px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .bench-card-actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
      }
      .bench-card-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
      }
      .bench-card-btn i {
        margin-right: 5px;
      }
      .btn-route {
        background: var(--primary);
        color: #fff;
      }
      .btn-reviews {
        background: var(--input-bg);
        color: var(--text);
      }
      .btn-fav {
        background: var(--input-bg);
        width: 50px;
        flex: none;
        color: var(--gray);
        font-size: 1.3em;
        cursor: pointer;
        border: none;
        border-radius: 12px;
      }
      .btn-fav.active {
        color: var(--red);
        background: #fdeceb;
      }
      .btn-report {
        background: var(--input-bg);
        width: 50px;
        flex: none;
        color: var(--gray);
        cursor: pointer;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
      }
      .btn-like {
        background: var(--input-bg);
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        cursor: pointer;
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: none;
        font-size: 14px;
        font-family: inherit;
      }
      .btn-like.active {
        color: var(--primary);
        background: #eef1fe;
      }
      .close-btn {
        background: rgba(91, 117, 248, 0.12);
        border: none;
        color: var(--primary);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1em;
        flex-shrink: 0;
      }
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(17, 24, 39, 0.45);
        z-index: 99999;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal.active {
        display: flex !important;
      }
      .modal-content {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 24px;
        width: 100%;
        max-width: 500px;
        max-height: 85vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      .modal-header h2 {
        font-size: 20px;
        color: var(--text);
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 100000;
        font-weight: 600;
        font-size: 14px;
        box-shadow: var(--shadow-btn);
      }
      .overlay-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(17, 24, 39, 0.5);
        z-index: 100000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .overlay-box {
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow-card);
        padding: 28px 24px;
        text-align: center;
        max-width: 360px;
        max-height: 80vh;
        width: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .overlay-box h3 {
        font-size: 18px;
        color: var(--text);
        margin-bottom: 12px;
      }
      .review-item {
        padding: 16px;
        background: var(--soft);
        border-radius: 14px;
        margin-bottom: 12px;
        border: 1px solid var(--border);
      }
      .profile-stat {
        flex: 1;
        text-align: center;
        padding: 16px;
        background: var(--soft);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .profile-stat .v {
        font-size: 1.6em;
        font-weight: 700;
        color: var(--primary);
      }
      .profile-stat div:last-child {
        color: var(--gray);
        font-size: 13px;
        margin-top: 4px;
      }
      .badge {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 10px;
        background: var(--input-bg);
        margin: 5px;
        font-size: 13px;
        color: var(--text);
      }
      .section-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        margin: 20px 0 10px;
      }
      @media (min-width: 768px) {
        #mainApp {
          max-width: 480px;
          margin: 0 auto;
          box-shadow: 0 0 50px rgba(0, 0, 0, 0.25);
        }
        .auth-card {
          max-width: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div id="authScreen">
      <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-location-dot"></i></div>
        <div class="auth-title">Скамейки Твери</div>
        <div class="auth-subtitle">Находите лучшие скамейки Твери рядом с вами</div>
        <div class="auth-tabs">
          <div class="auth-tab active" onclick="showLogin()">Вход</div>
          <div class="auth-tab" onclick="showRegister()">Регистрация</div>
        </div>
        <div id="loginBox">
          <div class="form-group">
            <label>Логин</label><input type="text" id="loginLogin" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="loginPassword" />
          </div>
          <button class="btn" onclick="doLogin()">Войти</button>
        </div>
        <div id="registerBox" style="display: none">
          <div class="form-group">
            <label>Логин (англ.)</label><input type="text" id="regLogin" />
          </div>
          <div class="form-group">
            <label>Никнейм</label><input type="text" id="regNickname" />
          </div>
          <div class="form-group">
            <label>Пароль</label><input type="password" id="regPassword" />
          </div>
          <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
        </div>
      </div>
    </div>
    <div id="mainApp">
      <div id="map"></div>
      <div class="search-container">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i
          ><input
            type="text"
            placeholder="Поиск по адресу..."
            id="searchInput"
            oninput="searchBenches()"
          /><button
            class="search-btn"
            onclick="searchByAddress()"
            id="searchBtn"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>
        <div id="searchResultsList"></div>
        <div id="addressResults" style="display: none"></div>
      </div>
      <div class="map-buttons">
        <button class="map-btn" onclick="findMe()">
          <i class="fa-solid fa-location-crosshairs"></i>
        </button>
        <button class="map-btn" onclick="showNearby()">
          <i class="fa-solid fa-chair"></i>
        </button>
        <button class="map-btn primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button class="map-btn" onclick="loadBenches()">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button class="map-btn" onclick="openProfile()">
          <i class="fa-solid fa-user"></i>
        </button>
        <button class="map-btn" onclick="openTopUsers()">
          <i class="fa-solid fa-trophy"></i>
        </button>
      </div>
      <div class="bench-card" id="benchCard">
        <div class="bench-card-handle" onclick="closeBenchCard()"></div>
        <div class="bench-card-content" id="benchCardContent"></div>
      </div>
    </div>
    <div id="reviewsModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Отзывы</h2>
        </div>
        <div id="reviewsContent"></div>
      </div>
    </div>
    <div id="profileModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Профиль</h2>
        </div>
        <div id="profileContent"></div>
      </div>
    </div>
    <div id="addModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Новая скамейка</h2>
        </div>
        <div id="addModalContent"></div>
      </div>
    </div>
    <div id="nearbyModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Поблизости</h2>
        </div>
        <div id="nearbyContent"></div>
      </div>
    </div>
    <div id="topModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Топ</h2>
        </div>
        <div id="topContent"></div>
      </div>
    </div>
    <script>
      var currentUser = null,
        userPosition = null,
        myMap = null,
        userPlacemark = null,
        allBenches = [],
        selectedBench = null,
        searchResults = [],
        searchTimeout = null,
        reviewRating = 0,
        profileInterval = null;
      if (window.Telegram && window.Telegram.WebApp) {
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          var overlays = document.querySelectorAll(".overlay-modal");
          if (overlays.length > 0) {
            overlays[overlays.length - 1].remove();
            return;
          }
          var modals = [
            "reviewsModal",
            "profileModal",
            "addModal",
            "nearbyModal",
            "topModal",
          ];
          for (var i = 0; i < modals.length; i++) {
            var el = document.getElementById(modals[i]);
            if (el && el.classList.contains("active")) {
              el.classList.remove("active");
              return;
            }
          }
          var benchCard = document.getElementById("benchCard");
          if (benchCard && benchCard.classList.contains("active")) {
            benchCard.classList.remove("active");
            return;
          }
          tg.BackButton.hide();
        });
      }
      var badWords = [
        "блять",
        "сука",
        "хуй",
        "пизда",
        "ебать",
        "нахуй",
        "хер",
        "мудак",
        "пидор",
        "шлюха",
        "жопа",
        "говно",
        "дерьмо",
        "тварь",
        "мразь",
        "сволочь",
        "чмо",
        "лох",
        "дебил",
        "идиот",
        "дурак",
        "тупой",
        "урод",
      ];
      function containsBadWords(t) {
        if (!t) return false;
        var l = t.toLowerCase();
        for (var i = 0; i < badWords.length; i++) {
          if (l.indexOf(badWords[i]) > -1) return true;
        }
        return false;
      }
      function isValidLatin(s) {
        return /^[a-zA-Z0-9_]+$/.test(s);
      }
      function escapeHtml(text) {
        if (!text) return "";
        var div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
      }
      function authHeaders() {
        var headers = {};
        if (currentUser && currentUser.token) {
          headers["Authorization"] = "Bearer " + currentUser.token;
        }
        return headers;
      }
      function closeModal(id) {
        document.getElementById(id).classList.remove("active");
      }
      document.querySelectorAll(".modal").forEach(function (m) {
        m.addEventListener("click", function (e) {
          if (e.target === m) {
            m.classList.remove("active");
          }
        });
      });
      function createBenchIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="8" y="40" width="48" height="5" rx="2.5" fill="#5b75f8"/><rect x="12" y="18" width="40" height="5" rx="2.5" fill="#7c8ffb"/><rect x="10" y="18" width="5" height="27" rx="2.5" fill="#3f57d6"/><rect x="49" y="18" width="5" height="27" rx="2.5" fill="#3f57d6"/><rect x="8" y="45" width="5" height="14" rx="2.5" fill="#3f57d6"/><rect x="51" y="45" width="5" height="14" rx="2.5" fill="#3f57d6"/></svg>',
            ),
          iconImageSize: [40, 40],
          iconImageOffset: [-20, -40],
        };
      }
      function createUserIcon() {
        return {
          iconLayout: "default#image",
          iconImageHref:
            "data:image/svg+xml;base64," +
            btoa(

              return;

            var results = [];
            allBenches.forEach(function (b) {
              var dd = calcDist(c[0], c[1], b.latitude, b.longitude);

                  dist:
                    dd < 1
                      ? Math.round(dd * 1000) + " м"
                      : dd.toFixed(1) + " км",
                  bench: b,
                  _dist: dd,
                });
              }
            });
            results.sort(function (a, b) {
              return a._dist - b._dist;
            });

              addrList.innerHTML =
                '<p style="padding:15px;color:var(--gray)">Нет скамеек в радиусе 5 км</p>';

      function calcDist(a, b, c, d) {
        var R = 6371,
          dLat = ((c - a) * Math.PI) / 180,
          dLon = ((d - b) * Math.PI) / 180;
        var x =
          Math.sin(dLat / 2) * Math.sin(dLat / 2) +
          Math.cos((a * Math.PI) / 180) *
            Math.cos((c * Math.PI) / 180) *
            Math.sin(dLon / 2) *
            Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }

        }
        document.getElementById("addModalContent").innerHTML =
          '<div class="form-group"><label>Фото (обязательно!)</label><input type="file" id="modalPhotoInput" accept="image/*" capture="environment" multiple></div><div id="photoPreview" style="display:flex;gap:10px;flex-wrap:wrap"></div><div class="form-group"><label>Описание</label><textarea id="modalBenchDesc" rows="3"></textarea></div><button class="btn" onclick="saveBench()">Сохранить</button>';
        document.getElementById("addModal").classList.add("active");
        document
          .getElementById("modalPhotoInput")
          .addEventListener("change", function (e) {
            var p = document.getElementById("photoPreview");
            p.innerHTML = "";
            Array.from(e.target.files).forEach(function (f) {
              var fr = new FileReader();
              fr.onload = function (ev) {
                var im = document.createElement("img");
                im.src = ev.target.result;
                im.style.cssText =
                  "width:80px;height:80px;object-fit:cover;border-radius:8px";
                p.appendChild(im);
              };
              fr.readAsDataURL(f);
            });
          });
      }
      function saveBench() {
        var d = document.getElementById("modalBenchDesc").value.trim(),
          f = document.getElementById("modalPhotoInput").files;
        if (!f.length) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Фото обязательно!");
          return;
        }
        if (!userPosition) {
          showToast("Сначала определите геопозицию");
          return;
        }
        if (containsBadWords(d)) {
          showOverlay("fa-xmark", "#e74c3c", "Ошибка", "Мат!");
          return;
        }
        var fd = new FormData();
        fd.append("description", d);
        fd.append("latitude", userPosition.lat);
        fd.append("longitude", userPosition.lng);
        fd.append("user_name", currentUser.nickname);
        for (var i = 0; i < f.length; i++) {
          fd.append("photos", f[i]);
        }
        fetch("/api/benches", {
          method: "POST",
          headers: authHeaders(),
          body: fd,
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              closeModal("addModal");
              showToast("Отправлено на модерацию!");
            } else {
              showOverlay(
                "fa-xmark",
                "#e74c3c",
                "Ошибка",
                d.error || "Не удалось добавить",
              );
            }
          })
          .catch(function () {
            showOverlay(
              "fa-xmark",
              "#e74c3c",
              "Ошибка",
              "Ошибка соединения с сервером",
            );
          });
      }
      function showNearby() {
        if (!userPosition) {
          showToast("Определите гео");
          return;
        }
        var near = allBenches
          .filter(function (b) {
            var dd = calcDist(
              userPosition.lat,
              userPosition.lng,
              b.latitude,
              b.longitude,
            );
            b._dist = dd;
            return dd <= 2;
          })
          .sort(function (a, b) {
            return a._dist - b._dist;
          });
        var h = "";
        if (!near.length) {
          h += '<p style="color:var(--gray)">Нет в радиусе 2 км</p>';
        } else {
          near.forEach(function (b) {
            h +=
              '<div class="search-result-item" onclick="focusBench(' +
              b.latitude +
              "," +
              b.longitude +
              ')"><i class="fa-solid fa-chair"></i><span class="name">' +
              escapeHtml(b.description || "Скамейка") +
              '</span><span class="dist">' +
              (b._dist < 1
                ? Math.round(b._dist * 1000) + " м"
                : b._dist.toFixed(1) + " км") +
              "</span></div>";
          });
        }
        document.getElementById("nearbyContent").innerHTML = h;
        document.getElementById("nearbyModal").classList.add("active");
      }
      function focusBench(lat, lng) {
        closeModal("nearbyModal");
        closeModal("profileModal");
        myMap.setCenter([lat, lng], 18);
      }
      function focusFavBench(benchId) {
        var bench = allBenches.find(function (b) {
          return b.id === benchId;
        });
        if (bench) {
          closeModal("profileModal");
          showBenchCard(bench);
        } else {
          showToast("Эта скамейка еще не одобрена");
        }
      }
      function openTopUsers() {
        fetch("/api/top-users")
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var h = "";
            d.users.forEach(function (u, i) {
              h +=
                '<div class="search-result-item"><span>' +
                (i + 1) +
                '</span><span class="name">' +
                escapeHtml(u.nickname) +
                '</span><span class="dist">⭐' +
                u.reputation +
                "</span></div>";
            });
            document.getElementById("topContent").innerHTML = h;
            document.getElementById("topModal").classList.add("active");
          });
      }
      function openProfile() {
        if (!currentUser) {
          showToast("Войдите");
          return;
        }
        var h =
          '<div style="display:flex;align-items:center;gap:15px;margin-bottom:20px"><div style="width:60px;height:60px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:2em;color:#fff">' +
          (currentUser.nickname
            ? currentUser.nickname.charAt(0).toUpperCase()
            : "?") +
          '</div><div><div style="font-weight:700">' +
          escapeHtml(currentUser.nickname) +
          '</div><div style="color:var(--gray)">@' +
          escapeHtml(currentUser.login) +
          "</div></div></div>";
        h +=
          '<div style="display:flex;gap:10px;margin-bottom:20px"><div class="profile-stat"><div class="v">' +
          (currentUser.reputation || 0) +
          '</div><div style="color:var(--gray)">Репутация</div></div></div>';
        h +=
          '<div class="section-title">Достижения</div><div id="badgesBox">Загрузка...</div>';
        h +=
          '<div class="section-title">Мои скамейки</div><div id="myBenchesBox" style="max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch">Загрузка...</div>';
        h +=
          '<div class="section-title">Избранное</div><div id="myFavBox">Загрузка...</div>';
        h +=
          '<div class="section-title">Отзывы</div><div id="myReviewsBox">Загрузка...</div>';
        h +=
          '<div class="section-title">Мои жалобы</div><div id="myReportsBox" style="max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch">Загрузка...</div>';
        h +=
          '<button class="btn" style="margin-top:15px;background:#e74c3c" onclick="logout()">Выйти</button>';
        document.getElementById("profileContent").innerHTML = h;
        document.getElementById("profileModal").classList.add("active");
        fetch("/api/user/" + currentUser.id + "/badges", {
          headers: authHeaders(),
        })
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("badgesBox").innerHTML =
              d && d.badges && d.badges.length
                ? d.badges
                    .map(function (b) {
                      return (
                        '<span class="badge"><i class="fa-solid ' +
                        b.icon +
                        '"></i>' +
                        b.name +
                        "</span>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/benches", {
          headers: authHeaders(),
        })
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("myBenchesBox").innerHTML =
              d && d.benches && d.benches.length
                ? d.benches
                    .map(function (b) {
                      var st =
                        b.status === "active"
                          ? "✅"
                          : b.status === "pending"
                            ? "⏳"
                            : "❌";
                      return (
                        '<div class="search-result-item"><span>' +
                        st +
                        '</span><span class="name">' +
                        escapeHtml(b.description || "Скамейка") +
                        "</span></div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/favorites", {
          headers: authHeaders(),
        })
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("myFavBox").innerHTML =
              d && d.favorites && d.favorites.length
                ? d.favorites
                    .map(function (b) {
                      return (
                        '<div class="search-result-item" onclick="focusFavBench(' +
                        b.id +
                        ')"><span class="name">' +
                        escapeHtml(b.description || "Скамейка") +
                        "</span></div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/received-reviews", {
          headers: authHeaders(),
        })
          .then((r) => r.json())
          .then(function (d) {
            document.getElementById("myReviewsBox").innerHTML =
              d && d.reviews && d.reviews.length
                ? d.reviews
                    .map(function (r) {
                      var ph = "";
                      if (r.photos && r.photos.length) {
                        ph =
                          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
                        r.photos.forEach(function (p) {
                          var u = p.photo_url;
                          if (u.indexOf("/") === 0)
                            u = window.location.origin + u;
                          ph +=
                            '<img src="' +
                            u +
                            '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">';
                        });
                        ph += "</div>";
                      }
                      return (
                        '<div class="review-item"><b>' +
                        escapeHtml(r.reviewer || "Аноним") +
                        "</b>: " +
                        escapeHtml(r.comment || "") +
                        ph +
                        "</div>"
                      );
                    })
                    .join("")
                : "Нет";
          });
        fetch("/api/user/" + currentUser.id + "/reports", {
          headers: authHeaders(),
        })
          .then((r) => r.json())
          .then(function (d) {
            var mr = document.getElementById("myReportsBox");
            if (d && d.reports && d.reports.length) {
              mr.innerHTML = d.reports
                .map(function (rp) {
                  var st =
                    rp.status === "pending"
                      ? "⏳ Ожидает"
                      : rp.admin_response
                        ? "✅ Отвечено"
                        : "✅ Обработана";
                  var resp = rp.admin_response
                    ? '<div style="color:var(--green);margin-top:5px"><i class="fa-solid fa-reply"></i> ' +
                      escapeHtml(rp.admin_response) +
                      "</div>"
                    : "";
                  var ph = "";
                  if (rp.photos && rp.photos.length) {
                    ph =
                      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">';
                    rp.photos.forEach(function (p) {
                      var u = p.photo_url;
                      if (u.indexOf("/") === 0) u = window.location.origin + u;
                      ph +=
                        '<img src="' +
                        u +
                        '" style="width:80px;height:80px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">';
                    });
                    ph += "</div>";
                  }
                  var removeBtn =
                    rp.status !== "pending"
                      ? '<button class="btn-sm" style="margin-top:8px;background:#5a6b7d;color:#fff;border:none;border-radius:8px;padding:6px 10px;cursor:pointer" onclick="removeReport(' +
                        rp.id +
                        ', this)">Убрать из списка</button>'
                      : "";
                  return (
                    '<div class="review-item"><b>' +
                    escapeHtml(rp.bench_name) +
                    '</b><div style="color:var(--gray);font-size:.9em">' +
                    escapeHtml(rp.reason) +
                    " — " +
                    st +
                    "</div>" +
                    ph +
                    resp +
                    removeBtn +
                    "</div>"
                  );
                })
                .join("");
            } else {
              mr.innerHTML = '<p style="color:var(--gray)">Нет жалоб</p>';
            }
          });
      }
      function removeReport(id, btn) {
        if (!confirm("Убрать жалобу из списка?")) return;
        fetch("/api/user/reports/" + id, {
          method: "DELETE",
          headers: authHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              var item = btn.closest(".review-item");
              if (item) item.remove();
              showToast("Убрано из списка");
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function reportReview(reviewId, benchId) {
        if (!currentUser) {
          showToast("Войдите");
          return;
        }
        var o = document.createElement("div");
        o.className = "overlay-modal";
        o.innerHTML =
          '<div class="overlay-box"><h3>Жалоба на отзыв</h3><div class="form-group" style="text-align:left"><label>Причина</label><select id="reviewReportReason" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)"><option value="spam">Спам</option><option value="insult">Оскорбление</option><option value="fake">Неточная информация</option></select></div><button class="btn" onclick="sendReviewReport(' +
          reviewId +
          ", " +
          benchId +
          ')">Отправить</button></div>';
        document.body.appendChild(o);
      }
      function sendReviewReport(reviewId, benchId) {
        var reason = document.getElementById("reviewReportReason").value;
        fetch("/api/reviews/" + reviewId + "/report", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            authHeaders(),
          ),
          body: JSON.stringify({ user_id: currentUser.id, reason: reason }),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              document.querySelectorAll(".overlay-modal").forEach(function (e) {
                e.remove();
              });
              showToast("Жалоба отправлена");
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function logout() {
        currentUser = null;
        localStorage.removeItem("tver_user");
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.remove("active");
        closeModal("profileModal");
      }
      var initialViewportHeight = window.innerHeight;
      window.addEventListener("resize", function () {
        if (window.innerHeight < initialViewportHeight * 0.7) {
          document.getElementById("authScreen").style.height = window.innerHeight + "px";
          document.getElementById("mainApp").style.height = window.innerHeight + "px";
        } else {
          document.getElementById("authScreen").style.height = "";
          document.getElementById("mainApp").style.height = "";
        }
      });
      checkAuth();
    </script>
  </body>
</html>
