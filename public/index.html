<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Скамейки Твери</title>

    <script
      src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=be38b093-5948-4c54-8f05-c79926ec60ed
"
      type="text/javascript"
    ></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        height: 100vh;
        overflow: hidden;
      }

      #authScreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #2c3e50;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }

      #authScreen.hidden {
        display: none;
      }

      .auth-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }

      .auth-logo {
        text-align: center;
        font-size: 3em;
        margin-bottom: 10px;
      }
      .auth-title {
        text-align: center;
        font-size: 1.5em;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 20px;
      }

      .auth-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .auth-tab {
        flex: 1;
        padding: 12px;
        text-align: center;
        background: #f5f6fa;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }
      .auth-tab.active {
        background: #2a5298;
        color: white;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 0.9em;
      }
      .form-group input {
        width: 100%;
        padding: 14px;
        border: 2px solid #e0e0e0;
        border-radius: 12px;
        font-size: 1em;
        outline: none;
      }

      .btn {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 1.1em;
        font-weight: 700;
        cursor: pointer;
        background: #27ae60;
        color: white;
      }

      #mainApp {
        display: none;
        height: 100vh;
        flex-direction: column;
      }
      #mainApp.active {
        display: flex;
      }

      .header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #27ae60;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1.3em;
      }

      #map {
        flex: 1;
        width: 100%;
      }

      .controls {
        background: white;
        padding: 10px;
        display: flex;
        gap: 10px;
      }

      .controls button {
        flex: 1;
        padding: 15px;
        border: none;
        border-radius: 12px;
        font-size: 0.95em;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-blue {
        background: #3498db;
        color: white;
      }
      .btn-green {
        background: #27ae60;
        color: white;
      }
      .btn-outline {
        background: white;
        color: #2a5298;
        border: 2px solid #2a5298;
      }

      .toast {
        position: fixed;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        background: #2c3e50;
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 3000;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="authScreen">
      <div class="auth-card">
        <div class="auth-logo">🪑</div>
        <div class="auth-title">Скамейки Твери</div>

        <div class="auth-tabs">
          <div class="auth-tab active" onclick="showLogin()">Вход</div>
          <div class="auth-tab" onclick="showRegister()">Регистрация</div>
        </div>

        <div id="loginBox">
          <div class="form-group">
            <label>Логин</label>
            <input type="text" id="loginLogin" />
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword" />
          </div>
          <button class="btn" onclick="doLogin()">Войти</button>
        </div>

        <div id="registerBox" style="display: none">
          <div class="form-group">
            <label>Логин</label>
            <input type="text" id="regLogin" />
          </div>
          <div class="form-group">
            <label>Никнейм</label>
            <input type="text" id="regNickname" />
          </div>
          <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="regPassword" />
          </div>
          <button class="btn" onclick="doRegister()">Зарегистрироваться</button>
        </div>
      </div>
    </div>

    <div id="mainApp">
      <div class="header">
        <div class="header-user">
          <div class="avatar" id="headerAvatar">👤</div>
          <div>
            <div style="font-weight: 700" id="headerName"></div>
            <div style="font-size: 0.8em; opacity: 0.8" id="headerLogin"></div>
          </div>
        </div>
        <div id="headerReputation">⭐ 0</div>
      </div>

      <div id="map"></div>

      <div class="controls">
        <button class="btn-blue" onclick="findMe()">📍 Я тут</button>
        <button class="btn-green" onclick="addBench()">➕ Добавить</button>
        <button class="btn-outline" onclick="loadBenches()">🔄</button>
        <button class="btn-outline" onclick="logout()" style="max-width: 60px">
          🚪
        </button>
      </div>
    </div>

    <script>
      var currentUser = null;
      var userPosition = null;
      var myMap = null;
      var userPlacemark = null;

      // Инициализация Яндекс.Карты
      ymaps.ready(function () {
        myMap = new ymaps.Map("map", {
          center: [56.8587, 35.9176],
          zoom: 13,
          controls: ["zoomControl"],
        });
        console.log("Яндекс.Карта загружена!");
        loadBenches();
      });

      function showLogin() {
        document.querySelectorAll(".auth-tab")[0].classList.add("active");
        document.querySelectorAll(".auth-tab")[1].classList.remove("active");
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("registerBox").style.display = "none";
      }

      function showRegister() {
        document.querySelectorAll(".auth-tab")[1].classList.add("active");
        document.querySelectorAll(".auth-tab")[0].classList.remove("active");
        document.getElementById("registerBox").style.display = "block";
        document.getElementById("loginBox").style.display = "none";
      }

      function showToast(msg) {
        var old = document.querySelector(".toast");
        if (old) old.remove();
        var toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(function () {
          toast.remove();
        }, 3000);
      }

      async function doRegister() {
        var login = document.getElementById("regLogin").value.trim();
        var nickname = document.getElementById("regNickname").value.trim();
        var password = document.getElementById("regPassword").value;

        if (!login || !nickname || !password) {
          showToast("Заполните все поля");
          return;
        }

        try {
          var response = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              login: login,
              password: password,
              nickname: nickname,
            }),
          });
          var data = await response.json();

          if (data.success) {
            showToast("Регистрация успешна! Войдите");
            showLogin();
            document.getElementById("loginLogin").value = login;
          } else {
            showToast(data.error || "Ошибка");
          }
        } catch (e) {
          showToast("Ошибка соединения");
        }
      }

      async function doLogin() {
        var login = document.getElementById("loginLogin").value.trim();
        var password = document.getElementById("loginPassword").value;

        if (!login || !password) {
          showToast("Введите логин и пароль");
          return;
        }

        try {
          var response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login: login, password: password }),
          });
          var data = await response.json();

          if (data.success) {
            currentUser = data.user;
            localStorage.setItem("tver_user", JSON.stringify(currentUser));

            document.getElementById("headerAvatar").textContent =
              currentUser.nickname.charAt(0).toUpperCase();
            document.getElementById("headerName").textContent =
              currentUser.nickname;
            document.getElementById("headerLogin").textContent =
              "@" + currentUser.login;
            document.getElementById("headerReputation").textContent =
              "⭐ " + currentUser.reputation;

            document.getElementById("authScreen").classList.add("hidden");
            document.getElementById("mainApp").classList.add("active");

            showToast("Добро пожаловать!");
            loadBenches();
            setTimeout(findMe, 1000);
          } else {
            showToast(data.error || "Ошибка входа");
          }
        } catch (e) {
          showToast("Ошибка соединения");
        }
      }

      function logout() {
        currentUser = null;
        localStorage.removeItem("tver_user");
        document.getElementById("authScreen").classList.remove("hidden");
        document.getElementById("mainApp").classList.remove("active");
      }

      function checkAuth() {
        var saved = localStorage.getItem("tver_user");
        if (saved) {
          currentUser = JSON.parse(saved);
          document.getElementById("authScreen").classList.add("hidden");
          document.getElementById("mainApp").classList.add("active");
          document.getElementById("headerAvatar").textContent =
            currentUser.nickname.charAt(0).toUpperCase();
          document.getElementById("headerName").textContent =
            currentUser.nickname;
          document.getElementById("headerLogin").textContent =
            "@" + currentUser.login;
          document.getElementById("headerReputation").textContent =
            "⭐ " + currentUser.reputation;
          setTimeout(findMe, 1000);
        }
      }

      function findMe() {
        if (navigator.geolocation && myMap) {
          navigator.geolocation.getCurrentPosition(function (pos) {
            userPosition = {
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
            };

            if (userPlacemark) myMap.geoObjects.remove(userPlacemark);

            userPlacemark = new ymaps.Placemark(
              [userPosition.lat, userPosition.lng],
              { balloonContent: "Вы здесь" },
              { preset: "islands#blueCircleIcon" },
            );

            myMap.geoObjects.add(userPlacemark);
            myMap.setCenter([userPosition.lat, userPosition.lng], 16);
            showToast("✅ Вы здесь!");
          });
        }
      }

      function loadBenches() {
        if (!myMap) return;

        fetch("/api/benches")
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (!data.success) return;

            myMap.geoObjects.removeAll();

            data.benches.forEach(function (bench) {
              var placemark = new ymaps.Placemark(
                [bench.latitude, bench.longitude],
                {
                  balloonContent:
                    "<b>" +
                    bench.name +
                    "</b><br>" +
                    (bench.description || "") +
                    "<br>" +
                    "<small>👤 " +
                    (bench.user_name || "Аноним") +
                    "</small>",
                },
                { preset: "islands#greenIcon" },
              );
              myMap.geoObjects.add(placemark);
            });
          });
      }

      function addBench() {
        if (!currentUser) {
          showToast("Сначала войдите");
          return;
        }

        if (!userPosition) {
          showToast('Нажмите "Я тут" сначала');
          return;
        }

        // Создаём модальное окно
        var modal = document.createElement("div");
        modal.style.cssText =
          "position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px;";

        modal.innerHTML = `
        <div style="background: white; border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto;">
            <h2 style="text-align: center; margin-bottom: 20px;">➕ Новая скамейка</h2>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">📸 Фотографии</label>
                <input type="file" id="modalPhotoInput" accept="image/*" multiple style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px;">
                <div id="photoPreview" style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;"></div>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">✏️ Название *</label>
                <input type="text" id="modalBenchName" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">📝 Описание</label>
                <textarea id="modalBenchDesc" rows="3" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px;"></textarea>
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-weight: 600; margin-bottom: 5px;">📍 Координаты</label>
                <div style="background: #f0f4f8; padding: 10px; border-radius: 10px; font-size: 0.9em;">
                    ${userPosition.lat.toFixed(5)}, ${userPosition.lng.toFixed(5)}
                </div>
            </div>
            
            <button onclick="saveBenchWithPhoto()" style="width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 12px; font-size: 1em; font-weight: 700; cursor: pointer;">💾 Сохранить</button>
            <button onclick="this.closest('div[style]').parentElement.remove()" style="width: 100%; padding: 10px; margin-top: 10px; background: none; border: none; color: #666; cursor: pointer;">Отмена</button>
        </div>
    `;

        document.body.appendChild(modal);

        // Превью фото
        document
          .getElementById("modalPhotoInput")
          .addEventListener("change", function (e) {
            var preview = document.getElementById("photoPreview");
            preview.innerHTML = "";

            Array.from(e.target.files).forEach(function (file) {
              var reader = new FileReader();
              reader.onload = function (e) {
                var img = document.createElement("img");
                img.src = e.target.result;
                img.style.cssText =
                  "width: 80px; height: 80px; object-fit: cover; border-radius: 8px;";
                preview.appendChild(img);
              };
              reader.readAsDataURL(file);
            });
          });
      }

      function saveBenchWithPhoto() {
        var name = document.getElementById("modalBenchName").value.trim();
        var description = document
          .getElementById("modalBenchDesc")
          .value.trim();
        var photos = document.getElementById("modalPhotoInput").files;

        if (!name) {
          showToast("Введите название");
          return;
        }

        var formData = new FormData();
        formData.append("name", name);
        formData.append("description", description);
        formData.append("latitude", userPosition.lat);
        formData.append("longitude", userPosition.lng);
        formData.append("user_id", currentUser.id);
        formData.append("user_name", currentUser.nickname);

        // Добавляем фото
        for (var i = 0; i < photos.length; i++) {
          formData.append("photos", photos[i]);
        }

        fetch("/api/benches", {
          method: "POST",
          body: formData,
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            if (data.success) {
              // Закрываем модалку
              var modal = document.querySelector(
                'div[style*="position: fixed"]',
              );
              if (modal) modal.remove();

              showToast("✅ Добавлено!");
              loadBenches();
            } else {
              showToast(data.error || "Ошибка");
            }
          });
      }

      checkAuth();
    </script>
  </body>
</html>
