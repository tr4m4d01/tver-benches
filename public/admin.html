<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель - Скамейки Твери</title>
    <style>
      :root {
        --dark: #0a0e17;
        --navy: #0f1b2d;
        --accent: #2d6da8;
        --white: #fff;
        --gray: #5a6b7d;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        background: var(--dark);
        color: var(--white);
        min-height: 100vh;
      }

      #loginScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }

      .login-card {
        background: var(--navy);
        border: 1px solid #1e3a5f;
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }

      .login-card h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
      }
      .form-group input {
        width: 100%;
        padding: 14px;
        background: #0a0e17;
        border: 1px solid #1e3a5f;
        border-radius: 10px;
        color: white;
        font-size: 1em;
      }

      .btn {
        width: 100%;
        padding: 15px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
      }

      #adminPanel {
        display: none;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        background: var(--navy);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #1e3a5f;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--navy);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid #1e3a5f;
      }
      .stat-value {
        font-size: 2em;
        font-weight: 700;
        color: var(--accent);
      }

      .bench-card {
        background: var(--navy);
        border: 1px solid #1e3a5f;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 15px;
      }

      .bench-card h3 {
        margin-bottom: 10px;
      }
      .bench-card p {
        color: var(--gray);
        margin-bottom: 10px;
      }

      .photos {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }

      .photos img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        border: 2px solid #1e3a5f;
        transition: all 0.3s;
      }

      .photos img:hover {
        transform: scale(1.05);
        border-color: var(--accent);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }

      .btn-approve {
        background: #27ae60;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }
      .btn-reject {
        background: #e74c3c;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }
      .btn-hide {
        background: #f39c12;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
      }

      .status {
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 0.85em;
        font-weight: 600;
      }
      .status-active {
        background: #d4edda;
        color: #155724;
      }
      .status-pending {
        background: #fff3cd;
        color: #856404;
      }
      .status-hidden {
        background: #f8d7da;
        color: #721c24;
      }

      #photoViewer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 5000;
        align-items: center;
        justify-content: center;
      }
      #photoViewer.active {
        display: flex;
      }
      #photoViewer img {
        max-width: 95%;
        max-height: 95%;
        object-fit: contain;
        border-radius: 10px;
      }
      #photoViewer .close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        font-size: 24px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="loginScreen">
      <div class="login-card">
        <h2>🔐 Админ-панель</h2>
        <div class="form-group">
          <label>Логин</label>
          <input type="text" id="adminLogin" placeholder="Введите логин" />
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Введите пароль"
          />
        </div>
        <button class="btn" onclick="login()">Войти</button>
      </div>
    </div>

    <div id="adminPanel">
      <div class="header">
        <h1>🪑 Админ-панель</h1>
        <button class="btn-reject" onclick="logout()">Выйти</button>
      </div>

      <div class="stats" id="statsContainer"></div>

      <h2 style="margin-bottom: 15px">Скамейки на модерации</h2>
      <div id="benchesList"></div>
    </div>

    <div id="photoViewer">
      <button class="close" onclick="closePhoto()">✕</button>
      <img id="viewerImg" src="" />
    </div>

    <script>
      const ADMIN_LOGIN = "admin";
      const ADMIN_PASSWORD = "admin_tver_2024";

      function login() {
        var login = document.getElementById("adminLogin").value.trim();
        var password = document.getElementById("adminPassword").value;

        if (login === ADMIN_LOGIN && password === ADMIN_PASSWORD) {
          localStorage.setItem("admin_auth", "true");
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          loadData();
        } else {
          alert("Неверный логин или пароль");
        }
      }

      function logout() {
        localStorage.removeItem("admin_auth");
        location.reload();
      }

      function checkAuth() {
        if (localStorage.getItem("admin_auth") === "true") {
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          loadData();
        }
      }

      async function loadData() {
        try {
          var benchesRes = await fetch("/api/admin/benches");
          var benchesData = await benchesRes.json();

          var statsRes = await fetch("/api/stats");
          var statsData = await statsRes.json();

          document.getElementById("statsContainer").innerHTML = `
                    <div class="stat-card">
                        <div class="stat-value">${statsData.total_benches}</div>
                        <div>Активных скамеек</div>
                    </div>
                `;

          var list = document.getElementById("benchesList");
          list.innerHTML = "";

          if (benchesData.benches.length === 0) {
            list.innerHTML = '<p style="color: var(--gray);">Нет скамеек</p>';
            return;
          }

          benchesData.benches.forEach(function (bench) {
            var card = document.createElement("div");
            card.className = "bench-card";

            var photosHtml = "";
            if (bench.photos && bench.photos.length > 0) {
              photosHtml =
                '<div class="photos">' +
                bench.photos
                  .map(function (photo) {
                    return (
                      '<img src="' +
                      photo.photo_url +
                      '" onclick="openPhoto(\'' +
                      photo.photo_url +
                      "')\">"
                    );
                  })
                  .join("") +
                "</div>";
            } else {
              photosHtml = '<p style="color: var(--gray);">Нет фото</p>';
            }

            card.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:start;">
                            <h3>🪑 ${bench.name}</h3>
                            <span class="status status-${bench.status}">${bench.status}</span>
                        </div>
                        <p>${bench.description || "Нет описания"}</p>
                        <p>👤 ${bench.user_name || "Аноним"}</p>
                        <p>📍 ${bench.latitude.toFixed(5)}, ${bench.longitude.toFixed(5)}</p>
                        ${photosHtml}
                        <div class="actions">
                            ${bench.status !== "active" ? `<button class="btn-approve" onclick="updateStatus(${bench.id}, 'active')">✅ Одобрить</button>` : ""}
                            ${bench.status !== "hidden" ? `<button class="btn-hide" onclick="updateStatus(${bench.id}, 'hidden')">👁️ Скрыть</button>` : ""}
                            <button class="btn-reject" onclick="deleteBench(${bench.id})">🗑️ Удалить</button>
                        </div>
                    `;

            list.appendChild(card);
          });
        } catch (e) {
          console.error(e);
        }
      }

      function openPhoto(url) {
        document.getElementById("viewerImg").src = url;
        document.getElementById("photoViewer").classList.add("active");
      }

      function closePhoto() {
        document.getElementById("photoViewer").classList.remove("active");
      }

      async function updateStatus(id, status) {
        await fetch(`/api/admin/benches/${id}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });
        loadData();
      }

      async function deleteBench(id) {
        if (!confirm("Удалить скамейку?")) return;
        await fetch(`/api/admin/benches/${id}`, { method: "DELETE" });
        loadData();
      }

      checkAuth();
    </script>
  </body>
</html>
