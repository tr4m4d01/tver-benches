<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель - Скамейки Твери</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script
      src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=1523c569-fb40-448b-8a73-6e1a37b34216"
      type="text/javascript"
    ></script>
    <style>
      :root {
        --primary: #2d6da8;
        --bg: #0a0e17;
        --card: #0f1b2d;
        --text: #fff;
        --gray: #5a6b7d;
        --border: #1e3a5f;
        --green: #27ae60;
        --red: #e74c3c;
        --yellow: #f39c12;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      #loginScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }
      .login-card h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
      }
      .form-group input {
        width: 100%;
        padding: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #fff;
        font-size: 1em;
      }
      .btn {
        width: 100%;
        padding: 15px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
      }
      #adminPanel {
        display: none;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        background: var(--card);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid var(--border);
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 12px 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        color: var(--gray);
      }
      .tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--card);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid var(--border);
        text-align: center;
      }
      .stat-card .v {
        font-size: 2em;
        font-weight: 700;
        color: var(--primary);
      }
      .bench-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 15px;
      }
      .bench-card h3 {
        margin-bottom: 10px;
      }
      .bench-card p {
        color: var(--gray);
        margin: 5px 0;
      }
      .photos {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .photos img {
        width: 150px;
        height: 150px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        border: 2px solid var(--border);
      }
      .photos img:hover {
        border-color: var(--primary);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .btn-sm {
        padding: 8px 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9em;
        color: #fff;
      }
      .btn-approve {
        background: var(--green);
      }
      .btn-reject {
        background: var(--red);
      }
      .btn-hide {
        background: var(--yellow);
      }
      .btn-view {
        background: var(--primary);
      }
      .user-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .report-card {
        background: var(--card);
        border: 1px solid var(--red);
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 10px;
      }
      .close-btn {
        background: rgba(45, 109, 168, 0.3);
        border: 1px solid rgba(45, 109, 168, 0.5);
        color: var(--primary);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #photoViewer {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 5000;
        align-items: center;
        justify-content: center;
      }
      #photoViewer.active {
        display: flex;
      }
      #photoViewer img {
        max-width: 95%;
        max-height: 95%;
        border-radius: 10px;
      }
      #photoViewer .close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: var(--primary);
        border: none;
        color: #fff;
        font-size: 24px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
      }
      #adminMap {
        width: 100%;
        height: 300px;
        border-radius: 15px;
        border: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--primary);
        color: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 100000;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="loginScreen">
      <div class="login-card">
        <h2><i class="fa-solid fa-lock"></i> Админ-панель</h2>
        <div class="form-group">
          <label>Логин</label><input type="text" id="adminLogin" />
        </div>
        <div class="form-group">
          <label>Пароль</label><input type="password" id="adminPassword" />
        </div>
        <button class="btn" onclick="login()">Войти</button>
      </div>
    </div>
    <div id="adminPanel">
      <div class="header">
        <h1><i class="fa-solid fa-chair"></i> Админ-панель</h1>
        <div style="display: flex; align-items: center; gap: 10px">
          <button
            class="btn-sm"
            style="background: rgba(255, 255, 255, 0.1)"
            onclick="showTab('notifications')"
            id="notificationsTabBtn"
          >
            <i class="fa-solid fa-bell"></i>
            <span
              id="notificationsBadge"
              style="
                display: none;
                background: var(--red);
                color: #fff;
                border-radius: 50%;
                padding: 2px 8px;
                font-size: 0.8em;
              "
              >0</span
            >
          </button>
          <button class="btn-sm btn-reject" onclick="logout()">Выйти</button>
        </div>
      </div>
      <div class="stats" id="statsContainer"></div>
      <div id="adminMap"></div>
      <div class="tabs">
        <div class="tab active" onclick="showTab('pending')">На модерации</div>
        <div class="tab" onclick="showTab('approved')">Одобренные</div>
        <div class="tab" onclick="showTab('users')">Пользователи</div>
        <div class="tab" onclick="showTab('reports')">Жалобы</div>
        <div class="tab" onclick="showTab('reviews')">Отзывы</div>
        <div class="tab" onclick="showTab('notifications')">Уведомления</div>
      </div>
      <div id="pendingTab"></div>
      <div id="approvedTab" style="display: none"></div>
      <div id="usersTab" style="display: none"></div>
      <div id="reportsTab" style="display: none"></div>
      <div id="reviewsTab" style="display: none"></div>
      <div id="notificationsTab" style="display: none"></div>
    </div>
    <div id="photoViewer">
      <button class="close" onclick="closePhoto()">
        <i class="fa-solid fa-xmark"></i></button
      ><img id="viewerImg" src="" />
    </div>
    <script>
      var adminToken = null;
      var adminUserId = null;
      function escapeHtml(text) {
        if (text === null || text === undefined) return "";
        var div = document.createElement("div");
        div.textContent = String(text);
        return div.innerHTML;
      }
      function adminHeaders() {
        var headers = {};
        if (adminToken) {
          headers["Authorization"] = "Bearer " + adminToken;
        }
        return headers;
      }
      async function login() {
        var l = document.getElementById("adminLogin").value.trim();
        var p = document.getElementById("adminPassword").value;
        try {
          var res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login: l, password: p }),
          });
          var data = await res.json();
          if (!data.success) {
            alert("Неверные данные");
            return;
          }
          adminToken = data.token;
          adminUserId = data.user.id;
          var adminRes = await fetch("/api/admin/benches", {
            headers: adminHeaders(),
          });
          var adminData = await adminRes.json();
          if (adminData.success) {
            localStorage.setItem("admin_token", adminToken);
            localStorage.setItem("admin_user_id", adminUserId);
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("adminPanel").style.display = "block";
            initAdminMap();
            loadAll();
          } else {
            alert(
              "Нет доступа к админке: " +
                (adminData.error || "недостаточно прав"),
            );
          }
        } catch (e) {
          alert("Ошибка соединения");
        }
      }
      function logout() {
        adminToken = null;
        adminUserId = null;
        localStorage.removeItem("admin_token");
        localStorage.removeItem("admin_user_id");
        location.reload();
      }
      async function checkAuth() {
        var token = localStorage.getItem("admin_token");
        var uid = localStorage.getItem("admin_user_id");
        if (token && uid) {
          adminToken = token;
          adminUserId = uid;
          try {
            var adminRes = await fetch("/api/admin/benches", {
              headers: adminHeaders(),
            });
            var adminData = await adminRes.json();
            if (adminData.success) {
              document.getElementById("loginScreen").style.display = "none";
              document.getElementById("adminPanel").style.display = "block";
              initAdminMap();
              loadAll();
            } else {
              logout();
            }
          } catch (e) {
            logout();
          }
        }
      }
      function loadAll() {
        loadStats();
        loadBenches();
        loadUsers();
        loadReports();
        loadReviews();
        loadNotifications();
        renderAdminMapMarkers();
      }
      function loadStats() {
        Promise.all([
          fetch("/api/admin/benches", { headers: adminHeaders() }).then(
            function (r) {
              return r.json();
            },
          ),
          fetch("/api/admin/users", { headers: adminHeaders() }).then(
            function (r) {
              return r.json();
            },
          ),
          fetch("/api/admin/reports", { headers: adminHeaders() }).then(
            function (r) {
              return r.json();
            },
          ),
        ]).then(function (results) {
          var bd = results[0],
            ud = results[1],
            rd = results[2];
          var pending = bd.benches.filter(function (b) {
            return b.status === "pending";
          }).length;
          var active = bd.benches.filter(function (b) {
            return b.status === "active";
          }).length;
          document.getElementById("statsContainer").innerHTML =
            '<div class="stat-card"><div class="v">' +
            pending +
            '</div><div>На модерации</div></div><div class="stat-card"><div class="v">' +
            active +
            '</div><div>Одобренные</div></div><div class="stat-card"><div class="v">' +
            ud.users.length +
            '</div><div>Пользователи</div></div><div class="stat-card"><div class="v">' +
            rd.reports.length +
            "</div><div>Жалобы</div></div>";
        });
      }
      function loadBenches() {
        fetch("/api/admin/benches", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var pending = d.benches.filter(function (b) {
              return b.status === "pending";
            });
            var approved = d.benches.filter(function (b) {
              return b.status === "active";
            });
            document.getElementById("pendingTab").innerHTML =
              renderBenches(pending);
            document.getElementById("approvedTab").innerHTML =
              renderBenches(approved);
          });
      }
      function renderBenches(benches) {
        if (!benches.length)
          return '<p style="color:var(--gray);text-align:center;padding:20px">Нет скамеек</p>';
        return benches
          .map(function (b) {
            var ph =
              b.photos && b.photos.length
                ? '<div class="photos">' +
                  b.photos
                    .map(function (p) {
                      var u = p.photo_url;
                      if (u.indexOf("/") === 0) u = window.location.origin + u;
                      return (
                        '<img src="' + u + '" onclick="openPhoto(this.src)">'
                      );
                    })
                    .join("") +
                  "</div>"
                : '<p style="color:var(--gray)">Нет фото</p>';
            return (
              '<div class="bench-card"><h3><i class="fa-solid fa-chair"></i> Скамейка</h3><p>' +
              escapeHtml(b.description || "Нет описания") +
              "</p><p>👤 " +
              escapeHtml(b.user_name) +
              "</p><p>❤️ " +
              (b.likes || 0) +
              "</p>" +
              ph +
              '<div class="actions"><button class="btn-sm btn-view" onclick="viewBench(' +
              b.id +
              ')">👁️ Посмотреть</button>' +
              (b.status !== "active"
                ? '<button class="btn-sm btn-approve" onclick="updateStatus(' +
                  b.id +
                  ",'active')\">✅ Одобрить</button>"
                : "") +
              '<button class="btn-sm btn-reject" onclick="rejectBench(' +
              b.id +
              ')">❌ Отклонить</button><button class="btn-sm btn-hide" onclick="updateStatus(' +
              b.id +
              ',\'hidden\')">👁️ Скрыть</button><button class="btn-sm btn-reject" onclick="deleteBench(' +
              b.id +
              ')">🗑️</button></div></div>'
            );
          })
          .join("");
      }
      function viewBench(id) {
        var existing = document.getElementById("benchDetailModal");
        if (existing) existing.remove();
        fetch("/api/admin/benches", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var bench = d.benches.find(function (b) {
              return b.id === id;
            });
            if (!bench) return;
            var ph =
              bench.photos && bench.photos.length
                ? bench.photos
                    .map(function (p) {
                      var u = p.photo_url;
                      if (u.indexOf("/") === 0) u = window.location.origin + u;
                      return (
                        '<img src="' +
                        u +
                        '" style="width:100%;max-width:300px;border-radius:10px;margin:5px;cursor:pointer" onclick="openPhoto(this.src)">'
                      );
                    })
                    .join("")
                : "<p>Нет фото</p>";
            var modal = document.createElement("div");
            modal.id = "benchDetailModal";
            modal.style.cssText =
              "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:6000;display:flex;align-items:center;justify-content:center;padding:20px";
            modal.onclick = function (e) {
              if (e.target === modal) modal.remove();
            };
            modal.innerHTML =
              '<div style="background:var(--card);border:1px solid var(--border);border-radius:20px;padding:25px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px"><h2>Скамейка #' +
              bench.id +
              '</h2><div style="display:flex;gap:8px"><button class="btn-sm btn-view" onclick="openBenchOnMap(' +
              bench.latitude +
              "," +
              bench.longitude +
              ')">🗺 Карта</button><button class="close-btn" onclick="document.getElementById(\'benchDetailModal\').remove()"><i class="fa-solid fa-xmark"></i></button></div></div><p>' +
              escapeHtml(bench.description || "") +
              '</p><p style="color:var(--gray)">👤 ' +
              escapeHtml(bench.user_name) +
              "</p><p>❤️ " +
              (bench.likes || 0) +
              '</p><div style="display:flex;flex-wrap:wrap;gap:10px">' +
              ph +
              "</div></div>";
            document.body.appendChild(modal);
          });
      }
      function openBenchOnMap(lat, lng) {
        var modal = document.getElementById("benchDetailModal");
        if (modal) modal.remove();
        if (adminMap) {
          adminMap.setCenter([lat, lng], 17);
        } else {
          alert("Карта еще не загружена");
        }
      }
      function loadUsers() {
        fetch("/api/admin/users", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.users.length) {
              document.getElementById("usersTab").innerHTML =
                '<p style="color:var(--gray)">Нет пользователей</p>';
              return;
            }
            document.getElementById("usersTab").innerHTML = d.users
              .map(function (u) {
                var adminBadge = u.is_admin
                  ? '<span style="color:var(--yellow);font-size:0.8em">Админ</span>'
                  : '<span style="color:var(--gray);font-size:0.8em">Пользователь</span>';
                return (
                  '<div class="user-card"><div><b>' +
                  escapeHtml(u.nickname) +
                  '</b><br><small style="color:var(--gray)">@' +
                  escapeHtml(u.login) +
                  "</small>" +
                  adminBadge +
                  '</div><div style="text-align:center"><div style="font-weight:700;color:var(--primary)">' +
                  u.reputation +
                  '</div><small style="color:var(--gray)">репутация</small></div><div style="text-align:center"><div style="font-weight:700">' +
                  u.total_benches +
                  '</div><small style="color:var(--gray)">скамеек</small></div><div style="display:flex;gap:5px">' +
                  (u.is_admin
                    ? '<button class="btn-sm btn-hide" onclick="toggleAdmin(' +
                      u.id +
                      ',0)">Убрать админа</button>'
                    : '<button class="btn-sm btn-approve" onclick="toggleAdmin(' +
                      u.id +
                      ',1)">Сделать админом</button>') +
                  "</div></div>"
                );
              })
              .join("");
          });
      }
      function toggleAdmin(uid, isAdmin) {
        if (
          !confirm(
            isAdmin
              ? "Назначить администратором?"
              : "Убрать права администратора?",
          )
        )
          return;
        fetch("/api/admin/users/" + uid + "/admin", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            adminHeaders(),
          ),
          body: JSON.stringify({ is_admin: isAdmin }),
        }).then(function () {
          loadUsers();
        });
      }
      function loadReports() {
        fetch("/api/admin/reports", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.reports || !d.reports.length) {
              document.getElementById("reportsTab").innerHTML =
                '<p style="color:var(--gray);text-align:center;padding:20px">Нет жалоб</p>';
              return;
            }
            document.getElementById("reportsTab").innerHTML = d.reports
              .map(function (rp) {
                var ph =
                  rp.photos && rp.photos.length
                    ? '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">' +
                      rp.photos
                        .map(function (p) {
                          var u = p.photo_url;
                          if (u.indexOf("/") === 0)
                            u = window.location.origin + u;
                          return (
                            '<img src="' +
                            u +
                            '" style="width:100px;height:100px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">'
                          );
                        })
                        .join("") +
                      "</div>"
                    : "";
                return (
                  '<div class="report-card"><div style="display:flex;justify-content:space-between"><b>' +
                  escapeHtml(rp.bench_name) +
                  '</b><span style="color:var(--red);font-size:.85em">' +
                  escapeHtml(rp.reason) +
                  '</span></div><p style="color:var(--gray)">👤 ' +
                  escapeHtml(rp.nickname || "Аноним") +
                  "</p>" +
                  ph +
                  '<div class="actions"><button class="btn-sm btn-view" onclick="respondReport(' +
                  rp.id +
                  ')">💬 Ответить</button><button class="btn-sm btn-approve" onclick="resolveReport(' +
                  rp.id +
                  ',\'delete\')">🗑️ Удалить</button><button class="btn-sm btn-hide" onclick="resolveReport(' +
                  rp.id +
                  ',\'hide\')">👁️ Скрыть</button><button class="btn-sm btn-approve" onclick="resolveReport(' +
                  rp.id +
                  ",'dismiss')\">✅ Отклонить жалобу</button></div></div>"
                );
              })
              .join("");
          });
      }
      function loadNotifications() {
        fetch("/api/admin/notifications", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var box = document.getElementById("notificationsTab");
            if (!d.notifications || !d.notifications.length) {
              box.innerHTML =
                '<p style="color:var(--gray);text-align:center;padding:20px">Нет уведомлений</p>';
              return;
            }
            var unread = d.notifications.filter(function (n) {
              return !n.read;
            });
            if (unread.length) {
              var badge = document.getElementById("notificationsBadge");
              badge.textContent = unread.length;
              badge.style.display = "inline-block";
            } else {
              document.getElementById("notificationsBadge").style.display =
                "none";
            }
            box.innerHTML = d.notifications
              .map(function (n) {
                return (
                  '<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:15px;margin-bottom:10px">' +
                  '<div style="font-weight:600">' +
                  escapeHtml(n.message) +
                  "</div>" +
                  '<small style="color:var(--gray)">' +
                  n.created_at +
                  "</small>" +
                  (n.type === "admin"
                    ? '<span style="color:var(--red)"> Важное</span>'
                    : "") +
                  "</div>"
                );
              })
              .join("");
          });
      }
      function loadReviews() {
        fetch("/api/admin/reviews", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.reviews || !d.reviews.length) {
              document.getElementById("reviewsTab").innerHTML =
                '<p style="color:var(--gray);text-align:center;padding:20px">Нет отзывов</p>';
              return;
            }
            document.getElementById("reviewsTab").innerHTML = d.reviews
              .map(function (rev) {
                var stars = "";
                for (var i = 1; i <= 5; i++) {
                  stars +=
                    '<i class="fa-solid fa-star" style="color:' +
                    (i <= rev.rating ? "#ffd700" : "#333") +
                    '"></i>';
                }
                var ph = "";
                if (rev.photos && rev.photos.length) {
                  ph =
                    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">';
                  rev.photos.forEach(function (p) {
                    var u = p.photo_url;
                    if (u.indexOf("/") === 0) u = window.location.origin + u;
                    ph +=
                      '<img src="' +
                      u +
                      '" style="width:100px;height:100px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="openPhoto(this.src)">';
                  });
                  ph += "</div>";
                }
                return (
                  '<div class="bench-card"><div style="display:flex;justify-content:space-between;align-items:center"><b>' +
                  escapeHtml(rev.bench_name || "Скамейка #" + rev.bench_id) +
                  '</b><span style="color:var(--yellow)">' +
                  stars +
                  '</span></div><p style="color:var(--gray)">👤 ' +
                  escapeHtml(rev.nickname || "Аноним") +
                  "</p><p>" +
                  escapeHtml(rev.comment || "") +
                  "</p>" +
                  ph +
                  '<div class="actions"><button class="btn-sm btn-reject" onclick="deleteReview(' +
                  rev.id +
                  ')">🗑️ Удалить</button></div></div>'
                );
              })
              .join("");
          });
      }
      function deleteReview(id) {
        if (!confirm("Удалить отзыв?")) return;
        fetch("/api/admin/reviews/" + id, {
          method: "DELETE",
          headers: adminHeaders(),
        })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (d.success) {
              showToast("Отзыв удален");
              loadReviews();
            } else {
              showToast(d.error || "Ошибка");
            }
          });
      }
      function renderAdminMapMarkers() {
        if (!adminMap) return;
        adminMap.geoObjects.removeAll();
        fetch("/api/admin/benches", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (!d.success) return;
            d.benches.forEach(function (b) {
              var pm = new ymaps.Placemark(
                [b.latitude, b.longitude],
                {
                  balloonContent:
                    escapeHtml(b.description || "Скамейка") +
                    "<br>Статус: " +
                    b.status,
                },
                {
                  iconLayout: "default#image",
                  iconImageHref:
                    "data:image/svg+xml;base64," +
                    btoa(
                      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="8" y="40" width="48" height="5" rx="2.5" fill="#2d6da8"/><rect x="12" y="18" width="40" height="5" rx="2.5" fill="#3d8bd0"/><rect x="10" y="18" width="5" height="27" rx="2.5" fill="#1e4d7a"/><rect x="49" y="18" width="5" height="27" rx="2.5" fill="#1e4d7a"/><rect x="8" y="45" width="5" height="14" rx="2.5" fill="#1e4d7a"/><rect x="51" y="45" width="5" height="14" rx="2.5" fill="#1e4d7a"/></svg>',
                    ),
                  iconImageSize: [40, 40],
                  iconImageOffset: [-20, -40],
                },
              );
              pm.events.add("click", function () {
                viewBench(b.id);
              });
              adminMap.geoObjects.add(pm);
            });
          });
      }
      function showTab(tab) {
        var tabs = [
          "pending",
          "approved",
          "users",
          "reports",
          "reviews",
          "notifications",
        ];
        document.querySelectorAll(".tab").forEach(function (t, i) {
          t.classList.remove("active");
        });
        document
          .querySelectorAll(".tab")
          [tabs.indexOf(tab)].classList.add("active");
        document.getElementById("pendingTab").style.display =
          tab === "pending" ? "block" : "none";
        document.getElementById("approvedTab").style.display =
          tab === "approved" ? "block" : "none";
        document.getElementById("usersTab").style.display =
          tab === "users" ? "block" : "none";
        document.getElementById("reportsTab").style.display =
          tab === "reports" ? "block" : "none";
        document.getElementById("reviewsTab").style.display =
          tab === "reviews" ? "block" : "none";
        document.getElementById("notificationsTab").style.display =
          tab === "notifications" ? "block" : "none";
        if (tab === "notifications") loadNotifications();
        var modal = document.getElementById("benchDetailModal");
        if (modal) modal.remove();
      }
      function updateStatus(id, status) {
        fetch("/api/admin/benches/" + id + "/status", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            adminHeaders(),
          ),
          body: JSON.stringify({ status: status }),
        }).then(function () {
          loadAll();
        });
      }
      function rejectBench(id) {
        var reason = prompt("Причина отклонения:", "Скамейки нет на месте");
        if (!reason) return;
        fetch("/api/admin/benches/" + id + "/status", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            adminHeaders(),
          ),
          body: JSON.stringify({ status: "hidden", reason: reason }),
        }).then(function () {
          loadAll();
        });
      }
      function deleteBench(id) {
        if (!confirm("Удалить?")) return;
        fetch("/api/admin/benches/" + id, {
          method: "DELETE",
          headers: adminHeaders(),
        }).then(function () {
          loadAll();
        });
      }
      function respondReport(reportId) {
        var response = prompt("Ответ пользователю:", "Спасибо за жалобу!");
        if (!response) return;
        fetch("/api/admin/reports/" + reportId + "/respond", {
          method: "POST",
          headers: Object.assign(
            { "Content-Type": "application/json" },
            adminHeaders(),
          ),
          body: JSON.stringify({ response: response }),
        }).then(function () {
          loadAll();
        });
      }
      function resolveReport(reportId, action) {
        fetch("/api/admin/reports", { headers: adminHeaders() })
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            var report = d.reports.find(function (r) {
              return r.id === reportId;
            });
            if (!report) return;
            var benchId = report.bench_id;
            if (action === "delete") {
              fetch("/api/admin/benches/" + benchId, {
                method: "DELETE",
                headers: adminHeaders(),
              }).then(function () {
                fetch("/api/admin/reports/" + reportId + "/resolve", {
                  method: "POST",
                  headers: adminHeaders(),
                }).then(function () {
                  loadAll();
                });
              });
            } else if (action === "hide") {
              fetch("/api/admin/benches/" + benchId + "/status", {
                method: "POST",
                headers: Object.assign(
                  { "Content-Type": "application/json" },
                  adminHeaders(),
                ),
                body: JSON.stringify({ status: "hidden" }),
              }).then(function () {
                fetch("/api/admin/reports/" + reportId + "/resolve", {
                  method: "POST",
                  headers: adminHeaders(),
                }).then(function () {
                  loadAll();
                });
              });
            } else {
              fetch("/api/admin/reports/" + reportId + "/resolve", {
                method: "POST",
                headers: adminHeaders(),
              }).then(function () {
                loadAll();
              });
            }
          });
      }
      function openPhoto(u) {
        document.getElementById("viewerImg").src = u;
        document.getElementById("photoViewer").classList.add("active");
      }
      function closePhoto() {
        document.getElementById("photoViewer").classList.remove("active");
      }
      var adminMap = null;
      function initAdminMap() {
        if (typeof ymaps === "undefined") {
          setTimeout(initAdminMap, 500);
          return;
        }
        if (typeof ymaps !== "undefined" && typeof ymaps.Map !== "undefined") {
          ymaps.ready(function () {
            if (adminMap) return;
            adminMap = new ymaps.Map("adminMap", {
              center: [56.8587, 35.9176],
              zoom: 13,
              controls: [],
            });
          });
        } else {
          setTimeout(initAdminMap, 500);
        }
      }
      ymaps &&
        ymaps.ready(function () {
          renderAdminMapMarkers();
        });
      checkAuth();
    </script>
  </body>
</html>
