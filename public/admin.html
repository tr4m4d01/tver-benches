<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель - Скамейки Твери</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      :root {
        --primary: #2d6da8;
        --bg: #0a0e17;
        --card: #0f1b2d;
        --text: #fff;
        --gray: #5a6b7d;
        --border: #1e3a5f;
        --green: #27ae60;
        --red: #e74c3c;
        --yellow: #f39c12;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }
      #loginScreen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .login-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        width: 100%;
        max-width: 400px;
      }
      .login-card h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        color: #ccc;
      }
      .form-group input {
        width: 100%;
        padding: 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        color: #fff;
        font-size: 1em;
      }
      .btn {
        width: 100%;
        padding: 15px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1em;
        font-weight: 700;
        cursor: pointer;
      }
      #adminPanel {
        display: none;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .header {
        background: var(--card);
        padding: 20px;
        border-radius: 15px;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid var(--border);
      }
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .tab {
        padding: 12px 20px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        color: var(--gray);
      }
      .tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--card);
        padding: 20px;
        border-radius: 15px;
        border: 1px solid var(--border);
        text-align: center;
      }
      .stat-card .v {
        font-size: 2em;
        font-weight: 700;
        color: var(--primary);
      }
      .bench-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 15px;
      }
      .bench-card h3 {
        margin-bottom: 10px;
      }
      .bench-card p {
        color: var(--gray);
        margin: 5px 0;
      }
      .photos {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .photos img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        border: 2px solid var(--border);
      }
      .photos img:hover {
        border-color: var(--primary);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .btn-sm {
        padding: 8px 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.9em;
        color: #fff;
      }
      .btn-approve {
        background: var(--green);
      }
      .btn-reject {
        background: var(--red);
      }
      .btn-hide {
        background: var(--yellow);
      }
      .status {
        padding: 5px 10px;
        border-radius: 15px;
        font-size: 0.85em;
        font-weight: 600;
      }
      .status-active {
        background: #d4edda;
        color: #155724;
      }
      .status-pending {
        background: #fff3cd;
        color: #856404;
      }
      .status-hidden {
        background: #f8d7da;
        color: #721c24;
      }
      .user-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .ai-reason {
        background: var(--bg);
        border: 1px solid var(--yellow);
        border-radius: 8px;
        padding: 10px;
        margin: 5px 0;
        color: var(--yellow);
        font-size: 0.9em;
      }
      .report-card {
        background: var(--card);
        border: 1px solid var(--red);
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 10px;
      }
      #photoViewer {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 5000;
        align-items: center;
        justify-content: center;
      }
      #photoViewer.active {
        display: flex;
      }
      #photoViewer img {
        max-width: 95%;
        max-height: 95%;
        border-radius: 10px;
      }
      #photoViewer .close {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: #fff;
        font-size: 24px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="loginScreen">
      <div class="login-card">
        <h2><i class="fa-solid fa-lock"></i> Админ-панель</h2>
        <div class="form-group">
          <label>Логин</label><input type="text" id="adminLogin" />
        </div>
        <div class="form-group">
          <label>Пароль</label><input type="password" id="adminPassword" />
        </div>
        <button class="btn" onclick="login()">Войти</button>
      </div>
    </div>

    <div id="adminPanel">
      <div class="header">
        <h1><i class="fa-solid fa-chair"></i> Админ-панель</h1>
        <button class="btn-sm btn-reject" onclick="logout()">Выйти</button>
      </div>

      <div class="stats" id="statsContainer"></div>

      <div class="tabs">
        <div class="tab active" onclick="showTab('pending')">
          ⏳ На модерации
        </div>
        <div class="tab" onclick="showTab('approved')">✅ Одобренные</div>
        <div class="tab" onclick="showTab('users')">👥 Пользователи</div>
        <div class="tab" onclick="showTab('reports')">🚫 Жалобы</div>
      </div>

      <div id="pendingTab"></div>
      <div id="approvedTab" style="display: none"></div>
      <div id="usersTab" style="display: none"></div>
      <div id="reportsTab" style="display: none"></div>
    </div>

    <div id="photoViewer">
      <button class="close" onclick="closePhoto()">✕</button>
      <img id="viewerImg" src="" />
    </div>

    <script>
      const ADMIN_LOGIN = "admin",
        ADMIN_PASSWORD = "admin_tver_2024";
      var allBenchesData = [];

      function login() {
        var l = document.getElementById("adminLogin").value.trim(),
          p = document.getElementById("adminPassword").value;
        if (l === ADMIN_LOGIN && p === ADMIN_PASSWORD) {
          localStorage.setItem("admin_auth", "true");
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          loadAll();
        } else {
          alert("Неверные данные");
        }
      }

      function logout() {
        localStorage.removeItem("admin_auth");
        location.reload();
      }

      function checkAuth() {
        if (localStorage.getItem("admin_auth") === "true") {
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("adminPanel").style.display = "block";
          loadAll();
        }
      }

      async function loadAll() {
        await loadStats();
        await loadBenches();
        await loadUsers();
        await loadReports();
      }

      async function loadStats() {
        try {
          var br = await fetch("/api/admin/benches");
          var bd = await br.json();
          var ur = await fetch("/api/admin/users");
          var ud = await ur.json();
          var rr = await fetch("/api/admin/reports");
          var rd = await rr.json();
          var pending = bd.benches.filter(function (b) {
            return b.status === "pending";
          }).length;
          var active = bd.benches.filter(function (b) {
            return b.status === "active";
          }).length;
          document.getElementById("statsContainer").innerHTML =
            '<div class="stat-card"><div class="v">' +
            pending +
            "</div><div>На модерации</div></div>" +
            '<div class="stat-card"><div class="v">' +
            active +
            "</div><div>Одобренные</div></div>" +
            '<div class="stat-card"><div class="v">' +
            ud.users.length +
            "</div><div>Пользователи</div></div>" +
            '<div class="stat-card"><div class="v">' +
            rd.reports.length +
            "</div><div>Жалобы</div></div>";
        } catch (e) {
          console.error(e);
        }
      }

      async function loadBenches() {
        try {
          var r = await fetch("/api/admin/benches");
          var d = await r.json();
          allBenchesData = d.benches;
          var pending = d.benches.filter(function (b) {
            return b.status === "pending";
          });
          var approved = d.benches.filter(function (b) {
            return b.status === "active";
          });
          document.getElementById("pendingTab").innerHTML =
            renderBenches(pending);
          document.getElementById("approvedTab").innerHTML =
            renderBenches(approved);
        } catch (e) {
          console.error(e);
        }
      }

      function renderBenches(benches) {
        if (!benches.length)
          return '<p style="color:var(--gray);text-align:center;padding:20px">Нет скамеек</p>';
        return benches
          .map(function (b) {
            var ph =
              b.photos && b.photos.length
                ? '<div class="photos">' +
                  b.photos
                    .map(function (p) {
                      return (
                        '<img src="' +
                        p.photo_url +
                        '" onclick="openPhoto(\'' +
                        p.photo_url +
                        "')\">"
                      );
                    })
                    .join("") +
                  "</div>"
                : '<p style="color:var(--gray)">Нет фото</p>';
            var aiBlock = b.ai_reason
              ? '<div class="ai-reason"><i class="fa-solid fa-robot"></i> ИИ: ' +
                b.ai_reason +
                " (уверенность: " +
                Math.round(b.ai_confidence * 100) +
                "%)</div>"
              : "";
            var rejectBlock = b.rejection_reason
              ? '<div class="ai-reason" style="border-color:var(--red);color:var(--red)"><i class="fa-solid fa-times"></i> Причина: ' +
                b.rejection_reason +
                "</div>"
              : "";
            return (
              '<div class="bench-card"><h3><i class="fa-solid fa-chair"></i> ' +
              b.name +
              "</h3><p>" +
              b.description +
              "</p><p>👤 " +
              b.user_name +
              "</p><p>📍 " +
              b.latitude +
              ", " +
              b.longitude +
              "</p>" +
              aiBlock +
              rejectBlock +
              ph +
              '<div class="actions">' +
              (b.status !== "active"
                ? '<button class="btn-sm btn-approve" onclick="updateStatus(' +
                  b.id +
                  ",'active')\">✅ Одобрить</button>"
                : "") +
              '<button class="btn-sm btn-reject" onclick="rejectBench(' +
              b.id +
              ')">❌ Отклонить</button>' +
              '<button class="btn-sm btn-hide" onclick="updateStatus(' +
              b.id +
              ",'hidden')\">👁️ Скрыть</button>" +
              '<button class="btn-sm btn-reject" onclick="deleteBench(' +
              b.id +
              ')">🗑️ Удалить</button></div></div>'
            );
          })
          .join("");
      }

      async function loadUsers() {
        try {
          var r = await fetch("/api/admin/users");
          var d = await r.json();
          if (!d.users.length) {
            document.getElementById("usersTab").innerHTML =
              '<p style="color:var(--gray)">Нет пользователей</p>';
            return;
          }
          document.getElementById("usersTab").innerHTML = d.users
            .map(function (u) {
              return (
                '<div class="user-card"><div><b>' +
                u.nickname +
                '</b><br><small style="color:var(--gray)">@' +
                u.login +
                '</small></div><div style="text-align:center"><div style="font-weight:700;color:var(--primary)">' +
                u.reputation +
                '</div><small style="color:var(--gray)">репутация</small></div><div style="text-align:center"><div style="font-weight:700">' +
                u.total_benches +
                '</div><small style="color:var(--gray)">скамеек</small></div></div>'
              );
            })
            .join("");
        } catch (e) {
          console.error(e);
        }
      }

      async function loadReports() {
        try {
          var r = await fetch("/api/admin/reports");
          var d = await r.json();
          if (!d.reports.length) {
            document.getElementById("reportsTab").innerHTML =
              '<p style="color:var(--gray);text-align:center;padding:20px">Нет жалоб</p>';
            return;
          }
          document.getElementById("reportsTab").innerHTML = d.reports
            .map(function (rp) {
              return (
                '<div class="report-card"><div style="display:flex;justify-content:space-between"><b>' +
                rp.bench_name +
                '</b><span style="color:var(--red);font-size:.85em">' +
                rp.reason +
                '</span></div><p style="color:var(--gray)">👤 ' +
                rp.nickname +
                '</p><p style="color:var(--gray);font-size:.85em">' +
                rp.created_at +
                "</p></div>"
              );
            })
            .join("");
        } catch (e) {
          console.error(e);
        }
      }

      function showTab(tab) {
        var tabs = ["pending", "approved", "users", "reports"];
        document.querySelectorAll(".tab").forEach(function (t, i) {
          t.classList.remove("active");
        });
        document
          .querySelectorAll(".tab")
          [tabs.indexOf(tab)].classList.add("active");
        document.getElementById("pendingTab").style.display =
          tab === "pending" ? "block" : "none";
        document.getElementById("approvedTab").style.display =
          tab === "approved" ? "block" : "none";
        document.getElementById("usersTab").style.display =
          tab === "users" ? "block" : "none";
        document.getElementById("reportsTab").style.display =
          tab === "reports" ? "block" : "none";
      }

      async function updateStatus(id, status) {
        await fetch("/api/admin/benches/" + id + "/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status }),
        });
        loadAll();
      }

      async function rejectBench(id) {
        var reason = prompt("Причина отклонения:", "Скамейки нет на месте");
        if (!reason) return;
        await fetch("/api/admin/benches/" + id + "/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "hidden", reason: reason }),
        });
        loadAll();
      }

      async function deleteBench(id) {
        if (!confirm("Удалить?")) return;
        await fetch("/api/admin/benches/" + id, { method: "DELETE" });
        loadAll();
      }

      function openPhoto(url) {
        document.getElementById("viewerImg").src = url;
        document.getElementById("photoViewer").classList.add("active");
      }
      function closePhoto() {
        document.getElementById("photoViewer").classList.remove("active");
      }

      checkAuth();
    </script>
  </body>
</html>
